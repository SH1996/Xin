<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>观妙 · 万象沙盘</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;background:#030712;color:#e2e8f0;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
::selection{background:rgba(34,211,238,0.25)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(34,211,238,0.15);border-radius:2px}

#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;top:10%;left:-10%;opacity:.06;background:radial-gradient(circle,rgba(34,211,238,0.6) 0%,transparent 70%);animation:pulseOrb 4s ease-in-out infinite}
.orb2{width:400px;height:400px;top:50%;right:-15%;opacity:.04;background:radial-gradient(circle,rgba(167,139,250,0.6) 0%,transparent 70%);animation:pulseOrb 4s ease-in-out infinite 1s}
.orb3{width:300px;height:300px;bottom:10%;left:20%;opacity:.03;background:radial-gradient(circle,rgba(244,114,182,0.5) 0%,transparent 70%);animation:pulseOrb 4s ease-in-out infinite 2s}
@keyframes pulseOrb{0%,100%{opacity:0.03;transform:scale(1)}50%{opacity:0.08;transform:scale(1.05)}}

.glass{background:rgba(10,15,30,0.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.05);box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.03)}
.hidden{display:none!important}
.text-grad{background:linear-gradient(135deg,#22d3ee,#a78bfa 50%,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.text-grad-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b 50%,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ─── 罗盘 ─── */
.compass-wrap{position:relative;width:80px;height:80px;margin:0 auto 16px}
.compass-outer{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.08);animation:spin 30s linear infinite}
.compass-outer2{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(167,139,250,.05);animation:spin 40s linear infinite reverse}
.compass-ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed rgba(34,211,238,.04);animation:spin 50s linear infinite}
.compass-core{position:absolute;inset:8px;border-radius:50%;background:rgba(10,15,30,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(34,211,238,0.1),0 0 80px rgba(167,139,250,0.05)}
.compass-core svg{width:28px;height:28px;color:#22d3ee;animation:spin 8s linear infinite}
.compass-tick{position:absolute;width:1px;height:6px;background:rgba(34,211,238,.15);top:4px;left:50%;transform-origin:50% 36px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Idle ─── */
.page{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
.page-scroll{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 100px}
.container{width:100%;max-width:400px;margin:0 auto}
.idle-title h1{font-family:'Noto Serif SC',serif;font-size:36px;font-weight:900;letter-spacing:12px;text-align:center;margin-bottom:6px}
.idle-subtitle{text-align:center;font-size:10px;opacity:.25;letter-spacing:3px;margin-bottom:30px;font-family:'Noto Serif SC',serif}
.input-card{border-radius:18px;padding:22px;margin-bottom:20px}
.input-label{font-size:11px;opacity:.4;margin-bottom:4px;font-family:'Noto Serif SC',serif;letter-spacing:2px}
.input-hint{font-size:10px;opacity:.2;margin-bottom:14px;line-height:1.5}
.main-input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.06);color:#e2e8f0;font-size:15px;font-family:inherit;outline:none;transition:all .3s;margin-bottom:12px}
.main-input:focus{border-color:rgba(34,211,238,.3);box-shadow:0 0 20px rgba(34,211,238,.1)}
.main-input::placeholder{color:rgba(255,255,255,.12)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{padding:6px 14px;border-radius:20px;font-size:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;font-family:inherit}
.tag:active{color:rgba(34,211,238,.7);border-color:rgba(34,211,238,.16);background:rgba(34,211,238,.04)}
.start-btn{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Serif SC',serif;color:#22d3ee;letter-spacing:3px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.12));border:1px solid rgba(34,211,238,.18);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .3s;touch-action:manipulation}
.start-btn:active{transform:scale(.97);background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(167,139,250,.22))}
.start-btn:disabled{opacity:.5;cursor:not-allowed}
.idle-footer{font-size:10px;opacity:.14;text-align:center;font-family:'Noto Serif SC',serif;margin-top:16px}

/* ─── Loading ─── */
.load-orb-wrap{position:relative;margin-bottom:30px}
.load-orb-compass{position:relative;width:96px;height:96px}
.load-orb-compass .ring1{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.12);animation:spin 20s linear infinite}
.load-orb-compass .ring2{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(167,139,250,.06);animation:spin 30s linear infinite reverse}
.load-orb-compass .ring3{position:absolute;inset:-24px;border-radius:50%;border:1px solid rgba(34,211,238,.04);animation:spin 40s linear infinite}
.load-orb-compass .core{position:absolute;inset:12px;border-radius:50%;background:rgba(10,15,30,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(34,211,238,.15),0 0 120px rgba(167,139,250,.08)}
.load-orb-compass .core svg{width:32px;height:32px;color:#22d3ee;animation:spin 6s linear infinite}
.load-text{text-align:center}
.load-text .label{font-size:10px;opacity:.3;margin-bottom:4px;font-family:'Noto Serif SC',serif;letter-spacing:3px}
.load-text .scene{font-size:15px;color:rgba(34,211,238,.7);font-family:'Noto Serif SC',serif;margin-bottom:8px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load-text .dots{font-size:11px;opacity:.2}

/* ─── Result Header ─── */
.res-header{position:sticky;top:0;z-index:40;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.res-header .left{display:flex;align-items:center;gap:10px;min-width:0}
.res-header .left .ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 24px rgba(34,211,238,.08)}
.res-header .left .ico svg{width:20px;height:20px;color:#22d3ee;animation:spin 12s linear infinite}
.res-header .left .info{min-width:0}
.res-header .left .info .t{font-family:'Noto Serif SC',serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-header .left .info .s{font-size:10px;opacity:.35}
.btn-reset{display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.4);font-size:11px;font-family:inherit;cursor:pointer;transition:all .2s;flex-shrink:0;touch-action:manipulation}
.btn-reset:active{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}

/* ─── Scene Ref ─── */
.scene-ref{text-align:center;padding:4px 16px 10px}
.scene-ref .lbl{font-size:10px;opacity:.22;margin-bottom:2px}
.scene-ref .txt{font-size:14px;color:rgba(34,211,238,.6);font-family:'Noto Serif SC',serif}

/* ─── Sandbox ─── */
.sbx{position:relative;width:100%;height:170px;overflow:hidden;max-width:400px;margin:0 auto 6px}
.sbx canvas{display:block;width:100%;height:100%}
.nodes-layer{position:absolute;inset:0;pointer-events:none}
.sbx-node{position:absolute;border-radius:50%;transform:translate(-50%,-50%);transition:all 1s cubic-bezier(.22,.1,.22,1.5);cursor:pointer;pointer-events:auto}
.sbx-node .ring{position:absolute;inset:-14px;border-radius:50%;border:1px dashed;opacity:.25;animation:spin 30s linear infinite}
.sbx-node .lbl{position:absolute;white-space:nowrap;transform:translate(-50%,14px);font-size:8px;opacity:.45}
.sbx-tip{position:fixed;z-index:300;background:rgba(10,15,30,.95);color:#e2e8f0;padding:10px 14px;font-size:11px;border:1px solid rgba(34,211,238,.2);max-width:200px;pointer-events:none;line-height:1.5;border-radius:10px;backdrop-filter:blur(20px)}

/* ─── Timeline ─── */
.timeline-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px}
.tl-row{display:flex;gap:14px}
.tl-col{display:flex;flex-direction:column;align-items:center;min-width:30px}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.06);background:rgba(10,15,30,.7);font-size:10px;font-weight:700;color:rgba(255,255,255,.4)}
.tl-line{width:1px;flex:1;min-height:30px;margin:4px 0;background:linear-gradient(180deg,rgba(34,211,238,.2),rgba(167,139,250,.1),rgba(34,211,238,.2))}
.tl-card{flex:1;padding:14px;border-radius:14px;margin-bottom:6px;background:linear-gradient(135deg,rgba(17,24,39,.8),rgba(26,32,53,.9));border:1px solid rgba(255,255,255,.04);animation:cardIn .5s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tl-card:active{border-color:rgba(34,211,238,.12)}
.tl-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;margin-bottom:8px}
.tl-badge.opening{background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.15);color:rgba(34,211,238,.7)}
.tl-badge.normal{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.45)}
.tl-badge.turning{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);color:rgba(251,191,36,.7)}
.tl-badge.depth{background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.15);color:rgba(167,139,250,.7)}
.tl-badge.end{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.55)}
.tl-surface{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:10px;line-height:1.6;font-weight:500}
.tl-expand{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:rgba(34,211,238,.5);cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0;transition:color .2s;touch-action:manipulation}
.tl-expand:active{color:rgba(34,211,238,.8)}
.tl-expand svg{width:14px;height:14px}
.tl-depth{max-height:0;overflow:hidden;transition:max-height .4s ease-out,opacity .3s ease-out,padding .3s ease-out;opacity:0}
.tl-depth.open{max-height:400px;opacity:1;padding-top:12px;margin-top:8px;border-top:1px solid rgba(255,255,255,.04)}
.tl-depth-text{font-size:12px;line-height:1.9;color:rgba(255,255,255,.45);font-family:'Noto Serif SC',serif}
.tl-gua{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:rgba(251,191,36,.4);margin-top:8px;font-style:italic}

/* ─── Summary ─── */
.summary-wrap{padding:0 16px 6px}
.summary-card{border-radius:16px;padding:18px;margin:10px 0 6px;animation:cardIn .6s ease-out .3s both}
.summary-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.summary-header svg{width:16px;height:16px;color:#fbbf24}
.summary-header h3{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;color:rgba(251,191,36,.7);letter-spacing:2px}
.summary-body{font-size:12px;line-height:1.9;color:rgba(255,255,255,.45);font-family:'Noto Serif SC',serif}
.summary-revelation{margin-top:8px;font-size:13px;color:rgba(34,211,238,.5);font-family:'Noto Serif SC',serif;font-style:italic}
.summary-keywords{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.summary-keywords span{padding:3px 10px;border-radius:20px;border:1px solid rgba(251,191,36,.12);font-size:10px;color:rgba(251,191,36,.5)}
.summary-chain{margin-top:8px;font-size:10px;opacity:.18}
.replay-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Serif SC',serif;color:#22d3ee;letter-spacing:3px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.12));border:1px solid rgba(34,211,238,.15);transition:all .3s;touch-action:manipulation}
.replay-btn:active{transform:scale(.96)}
.replay-ctr{text-align:center;padding:8px 0 30px}

@media(max-width:380px){.idle-title h1{font-size:30px}.input-card{padding:18px}}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="nebula-orb orb1"></div><div class="nebula-orb orb2"></div><div class="nebula-orb orb3"></div>

<!-- ═══════ IDLE ═══════ -->
<div class="page" id="idlePage">
  <div class="container">
    <div class="compass-wrap">
      <div class="compass-outer"></div><div class="compass-outer2"></div><div class="compass-ring"></div>
      <div class="compass-core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/></svg>
      </div>
    </div>
    <div class="idle-title"><h1 class="text-grad">观 妙</h1></div>
    <div class="idle-subtitle">易 · 六十四卦 · 万象沙盘</div>
    <div class="input-card glass">
      <div class="input-label">入 局 之 事</div>
      <div class="input-hint">输入你正在经历的事，观妙将推演其中暗藏的变化与转机</div>
      <input class="main-input" id="sceneInput" placeholder="比如：想开店但心里没底…" maxlength="100">
      <div class="tags">
        <span class="tag" data-tag="感情">感情</span>
        <span class="tag" data-tag="工作">工作</span>
        <span class="tag" data-tag="创业">创业</span>
        <span class="tag" data-tag="开店">开店</span>
        <span class="tag" data-tag="学习">学习</span>
        <span class="tag" data-tag="理财">理财</span>
      </div>
      <button class="start-btn" id="startBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
        起 卦 推 演
      </button>
    </div>
    <div class="idle-footer">万象之中，因果相连，推演即洞见</div>
  </div>
</div>

<!-- ═══════ LOADING ═══════ -->
<div class="page hidden" id="loadingPage">
  <div class="load-orb-wrap">
    <div class="load-orb-compass">
      <div class="ring1"></div><div class="ring2"></div><div class="ring3"></div>
      <div class="core glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/></svg>
      </div>
    </div>
  </div>
  <div class="load-text">
    <div class="label">正在推演</div>
    <div class="scene" id="loadScene">「---」</div>
    <div class="dots" id="loadDots">推演因果链</div>
  </div>
</div>

<!-- ═══════ RESULT ═══════ -->
<div class="page-scroll hidden" id="resultPage">
  <div class="res-header glass">
    <div class="left">
      <div class="ico glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9"/></svg>
      </div>
      <div class="info">
        <div class="t" id="resTitle">观妙沙盘</div>
        <div class="s" id="resSub"></div>
      </div>
    </div>
    <button class="btn-reset" onclick="resetAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
      重置
    </button>
  </div>
  <div class="scene-ref"><div class="lbl">入局之事</div><div class="txt" id="resScene">「---」</div></div>
  <div class="sbx" id="sandbox"><canvas id="sandboxCvs"></canvas><div class="nodes-layer" id="nodesLayer"></div></div>
  <div class="timeline-wrap" id="timelineWrap"></div>
  <div class="summary-wrap"><div class="summary-card glass" id="summaryCard"></div></div>
  <div class="replay-ctr"><button class="replay-btn" onclick="resetAll()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg>再 开 一 局</button></div>
</div>

function extractWords(s){
  const def=['这件事','所有问题','事情','生活里的一个变量'];
  if(!s||s.length<2)return def;
  const parts=s.split(/[，。！？、,.\s]+/).filter(p=>p.length>1);
  const picked=parts.slice(0,4);
  while(picked.length<4)picked.push(def[picked.length]);
  return picked.map(p=>p.length>15?p.substring(0,15)+'…':p);
}

function drng(){var w=scv.width,h=scv.height,tt=Date.now()*.00015;for(var i=0;i<ST.nodes.length;i++){var n=ST.nodes[i];if(n.type!=='core'||!n._guaId)continue;var x=n.x*w,y=n.y*h,r=12+Math.sin(tt*8+n.x*6)*2.5;scx.strokeStyle=n.color+'0c';scx.lineWidth=.25;scx.setLineDash([2,14]);scx.beginPath();scx.arc(x,y,r,0,Math.PI*2);scx.stroke();scx.setLineDash([]);var gua=gById(n._guaId);if(gua){var lines=gua.s.charCodeAt(0)-19904;var segs=6;for(var j=0;j<segs;j++){var ang=(j/segs)*Math.PI*2-Math.PI/2+tt*.3,lr=r+8;var yin=(lines>>(segs-1-j))&1;scx.strokeStyle=n.color+'25';scx.lineWidth=.7;scx.beginPath();scx.moveTo(x+Math.cos(ang)*lr,y+Math.sin(ang)*lr);if(yin){scx.lineTo(x+Math.cos(ang)*(lr+5),y+Math.sin(ang)*(lr+5));var ga=Math.cos(ang)*(lr+2)+x,gb=Math.sin(ang)*(lr+2)+y;scx.moveTo(x+Math.cos(ang+.02)*(lr+5),y+Math.sin(ang+.02)*(lr+5));scx.lineTo(x+Math.cos(ang-.02)*(lr+5),y+Math.sin(ang-.02)*(lr+5))}else{scx.moveTo(x+Math.cos(ang)*(lr+2),y+Math.sin(ang)*(lr+2));scx.lineTo(x+Math.cos(ang)*(lr+5),y+Math.sin(ang)*(lr+5));scx.moveTo(x+Math.cos(ang-.03)*(lr+4),y+Math.sin(ang-.03)*(lr+4));scx.lineTo(x+Math.cos(ang+.03)*(lr+4),y+Math.sin(ang+.03)*(lr+4))}scx.stroke()}}}}
function dth(){var w=scv.width,h=scv.height,t=Date.now()*.0004;for(var i=0;i<ST.threads.length;i++){var th=ST.threads[i],a=ST.nodes.find(function(n){return n.id===th.from}),b=ST.nodes.find(function(n){return n.id===th.to});if(!a||!b)continue;var fx=a.x*w,fy=a.y*h,tx=b.x*w,ty=b.y*h,dx=tx-fx,dy=ty-fy,d=Math.sqrt(dx*dx+dy*dy);if(d<1)continue;var mx=(fx+tx)/2,my=(fy+ty)/2;scx.save();scx.strokeStyle='rgba(160,200,240,'+(.04+Math.sin(t*2+i)*.02)+')';scx.lineWidth=.25+Math.sin(t*3+i)*.1;scx.setLineDash([.5,12+Math.random()*8]);scx.beginPath();scx.moveTo(fx,fy);scx.quadraticCurveTo(mx+Math.cos(Math.atan2(dy,dx)+Math.PI/2)*d*.2,my+Math.sin(Math.atan2(dy,dx)+Math.PI/2)*d*.2,tx,ty);scx.stroke();scx.setLineDash([]);var cx=fx+Math.cos(t+i*.7)*d*.3,cy=fy+Math.sin(t+i*.7)*d*.3;scx.fillStyle='rgba(200,230,255,'+(.15+Math.sin(t*5+i)*.1)+')';scx.beginPath();scx.arc(cx,cy,.6,0,Math.PI*2);scx.fill();scx.restore()}}
function dnd(){var w=scv.width,h=scv.height,t=Date.now()*.0004;for(var i=0;i<ST.nodes.length;i++){var n=ST.nodes[i],x=n.x*w,y=n.y*h,sz=n.type==='core'?8:4.5,pulse=.7+Math.sin(t*3+n.x*7+n.y*13)*.3;if(n.type==='core'){var g1=scx.createRadialGradient(x,y,0,x,y,sz*4);g1.addColorStop(0,n.color+'30');g1.addColorStop(.3,n.color+'10');g1.addColorStop(1,'transparent');scx.fillStyle=g1;scx.beginPath();scx.arc(x,y,sz*4,0,Math.PI*2);scx.fill();var g2=scx.createRadialGradient(x,y,sz*.3,x,y,sz*2.2);g2.addColorStop(0,'rgba(255,255,255,.9)');g2.addColorStop(.25,n.color+'cc');g2.addColorStop(.6,n.color+'40');g2.addColorStop(1,'transparent');scx.fillStyle=g2;scx.beginPath();scx.arc(x,y,sz*2.2,0,Math.PI*2);scx.fill();scx.strokeStyle=n.color+'55';scx.lineWidth=.8;scx.beginPath();scx.arc(x,y,sz*1.6,0,Math.PI*2);scx.stroke();scx.strokeStyle=n.color+'18';scx.lineWidth=.35;scx.beginPath();scx.arc(x,y,sz*3,0,Math.PI*2);scx.stroke()}else{var g3=scx.createRadialGradient(x,y,0,x,y,sz*2.5);g3.addColorStop(0,n.color+'aa');g3.addColorStop(.4,n.color+'18');g3.addColorStop(1,'transparent');scx.fillStyle=g3;scx.beginPath();scx.arc(x,y,sz*2.5,0,Math.PI*2);scx.fill();scx.fillStyle='rgba(255,255,255,.7)';scx.beginPath();scx.arc(x,y,sz*.8,0,Math.PI*2);scx.fill()}}}
function rsbx(){if(ST.anim)cancelAnimationFrame(ST.anim);ST.anim=requestAnimationFrame(()=>{dsbg();drng();dth();dnd()})}
function rnhtml(){const l=document.getElementById('nodesLayer');l.innerHTML='';for(const n of ST.nodes){const el=document.createElement('div');el.className='sbx-node';el.style.left=(n.x*100)+'%';el.style.top=(n.y*100)+'%';el.style.width=(n.type==='core'?10:7)+'px';el.style.height=(n.type==='core'?10:7)+'px';el.style.background='radial-gradient(circle,'+n.color+','+n.color+'88)';el.style.color=n.color;if(n._guaId){const ri=document.createElement('div');ri.className='ring';ri.style.borderColor=n.color+'25';el.appendChild(ri)}const lb=document.createElement('div');lb.className='lbl';lb.textContent=n.label;el.appendChild(lb);el.addEventListener('click',e=>{e.stopPropagation();const old=document.querySelector('.sbx-tip');if(old)old.remove();const tip=document.createElement('div');tip.className='sbx-tip';let ex='';if(n._guaId){const g=gById(n._guaId);if(g)ex='<br><span style="font-size:9px;color:'+n.color+'">'+g.s+' '+g.n+'卦·'+g.na+'</span>'}tip.innerHTML='<strong style="color:'+n.color+'">'+n.label+'</strong><br><span style="font-size:9px;opacity:.4">'+(n.meaning||'')+'</span>'+ex;tip.style.left=Math.min(e.clientX+6,innerWidth-210)+'px';tip.style.top=Math.max(e.clientY-45,6)+'px';document.body.appendChild(tip);setTimeout(()=>tip.remove(),2600)});l.appendChild(el)}}
function ln(){var co=[],ev=[];for(var i=0;i<ST.nodes.length;i++){var n=ST.nodes[i];if(n.type==='core'){co.push(n)}else{ev.push(n)}}var cx=0.5,cy=0.5,Rx=0.32,Ry=0.3;for(var i=0;i<co.length;i++){var n=co[i];if(co.length===1){n.x=cx;n.y=cy}else{var a=(i/co.length)*Math.PI*2-Math.PI/2;n.x=cx+Math.cos(a)*Rx;n.y=cy+Math.sin(a)*Ry}}var groups=[];for(var i=0;i<co.length;i++){groups[i]=[]}for(var i=0;i<ev.length;i++){var n=ev[i],best=0,bestD=Infinity;for(var j=0;j<co.length;j++){var c=co[j],dx=n.x-c.x,dy=n.y-c.y,d2=dx*dx+dy*dy;if(d2<bestD){bestD=d2;best=j}}groups[best].push(n)}for(var i=0;i<co.length;i++){var c=co[i],g2=groups[i]||[];if(g2.length===0)continue;var ca=(i/co.length)*Math.PI*2-Math.PI/2;if(co.length===1)ca=0;for(var j=0;j<g2.length;j++){var n=g2[j];var angOff=ca-Math.PI*0.3+(j/g2.length)*Math.PI*1.6;var spread=0.08+(j/g2.length)*0.2;n.x=Math.min(0.94,Math.max(0.06,c.x+Math.cos(angOff)*spread));n.y=Math.min(0.94,Math.max(0.06,c.y+Math.sin(angOff)*spread*0.7))}}for(var i=0;i<ST.nodes.length;i++){var n=ST.nodes[i];n.x=Math.min(0.94,Math.max(0.06,n.x));n.y=Math.min(0.94,Math.max(0.06,n.y))}ST.threads=[];for(var i=0;i<co.length;i++){for(var j=i+1;j<co.length;j++){ST.threads.push({from:co[i].id,to:co[j].id})}}for(var i=0;i<ev.length;i++){var e=ev[i],b=co[0],bestD=Infinity;for(var j=0;j<co.length;j++){var c=co[j];var d2=(e.x-c.x)*(e.x-c.x)+(e.y-c.y)*(e.y-c.y);if(d2<bestD){bestD=d2;b=c}}ST.threads.push({from:b.id,to:e.id})}}

//  ═══ AI ═══
async function cai(p){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_KEY},body:JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'user',content:p}],max_tokens:2200,temperature:0.95}),signal:ctl.signal});clearTimeout(to);const d=await r.json();return (d.choices&&d.choices[0]?d.choices[0].message.content:'')||''}catch(e){clearTimeout(to);return null}}
function bp(){const hist=ST.history.map((h,i)=>'第'+(i+1)+'步「'+h.phase+'」'+h.surface+': '+h.depth+' ['+gSym(h.guaId)+' '+(((gById(h.guaId)||{}).n)||'')+'卦]').join('\n');const usedGua=ST.history.map(h=>h.guaId).filter(Boolean);const avail=GUA.filter(g=>!usedGua.includes(g.id)).slice(0,40).map(g=>g.id+'·'+g.s+g.n+'卦('+g.na+')').join(', ');const st=ST.step===0?'opening':(ST.step===MAX-1?'end':(ST.step===Math.floor(MAX/2)?'turning':(ST.step===Math.floor(MAX/2)+1?'depth':'normal')));return AI_PROMPT.replace(/\$SCENE\$/g,ST.scene).replace('$STEP$',ST.step+1).replace('$MAX$',MAX).replace('$STEPTYPE$',st).replace('$USED$',usedGua.join(',')||'无').replace('$POOL$',avail.substring(0,500)).replace('$HIST$',hist.substring(0,400)||'开局')}
function bsp(){const hist=ST.history.map((h,i)=>'第'+(i+1)+'步['+h.type+']「'+h.phase+'」'+h.surface+': '+h.depth+' ['+(((gById(h.guaId)||{}).n)||'')+'卦]').join('\n');const chain=ST.history.map(h=>(((gById(h.guaId)||{}).s)||'')+' '+(((gById(h.guaId)||{}).n)||'')).join(' → ');return SUM_PROMPT.replace(/\$SCENE\$/g,ST.scene).replace('$HIST$',hist.substring(0,800)).replace('$CHAIN$',chain)}

async function exs(){if(ST.step>=8)return;const raw=await cai(bp());let data;try{const m=(raw||"").match(/\{[\s\S]*\}/);if(m)data=JSON.parse(m[0])}catch(e){}if(!data||!data.phase)data=FB[ST.step%FB.length];if(data.guaId){const g=gById(data.guaId);if(!g){const ids=GUA.filter(g=>!ST.history.map(h=>h.guaId).includes(g.id)).map(g=>g.id);data.guaId=ids[Math.floor(Math.random()*ids.length)]||1}}ap(data)}
function apAll(steps){if(!steps||steps.length===0)return;var allSteps=[];for(var i=0;i<steps.length;i++){var d=steps[i];if(!d.phase&&!d.surface)continue;d.type=d.type||'pushing';d.phase=d.phase||'推演';d.surface=d.surface||'';d.depth=d.depth||'';d.yaoText=d.yaoText||'';d.guaId=d.guaId||Math.floor(Math.random()*64)+1;d.nodes=d.nodes||[{label:'.',type:'event',meaning:'',color:'#22d3ee'}];allSteps.push(d)}var startId=0;for(var i=0;i<allSteps.length;i++){var d=allSteps[i];var nn=(d.nodes||[]).map(function(n,j){return{id:startId+j,type:n.type||'event',label:n.label||'·',meaning:n.meaning||'',color:n.color||PAL[(startId+j)%PAL.length],x:0,y:0,_guaId:null}});var ci=nn.findIndex(function(n){return n.type==='core'});if(ci>=0)nn[ci]._guaId=d.guaId;ST.nodes.push.apply(ST.nodes,nn);startId+=nn.length;ST.history.push({phase:d.phase||'?',surface:d.surface||'',depth:d.depth||'',yaoText:d.yaoText||'',type:d.type||'normal',guaId:d.guaId});ST.step++}ln();rnhtml();rsbx();rtl();uh();setTimeout(gs,500)}
function finishScene(){clearInterval(loadTimer);document.getElementById('loadingPage').classList.add('hidden');document.getElementById('resultPage').classList.remove('hidden');rsb()}
function ap(d){const bi=ST.nodes.length;const nn=(d.nodes||[]).map((n,i)=>({id:bi+i,type:n.type||'event',label:n.label||'·',meaning:n.meaning||'',color:n.color||PAL[(bi+i)%PAL.length],x:0,y:0,_guaId:null}));const ci=nn.findIndex(n=>n.type==='core');if(ci>=0)nn[ci]._guaId=d.guaId;ST.nodes.push(...nn);ln();ST.history.push({phase:d.phase||'?',surface:d.surface||'',depth:d.depth||'',yaoText:d.yaoText||'',type:d.type||'normal',guaId:d.guaId});ST.step++;rsbx();rnhtml();rtl();uh();if(ST.step>=MAX)setTimeout(gs,800)}

//  ═══ Timeline ═══
function rtl(){const w=document.getElementById('timelineWrap');w.innerHTML='';const lb={opening:'开局',normal:'推演',turning:'转折',depth:'深入',end:'收官'};for(let i=0;i<ST.history.length;i++){const h=ST.history[i],g=gById(h.guaId),gs=g?g.s:'?',gn=g?g.n+'卦':'',gnat=g?g.na:'';const il=i===ST.history.length-1;const div=document.createElement('div');div.className='tl-row';div.innerHTML='<div class="tl-col"><div class="tl-dot">'+(i+1)+'</div>'+(il?'':'<div class="tl-line"></div>')+'</div><div class="tl-card"><div class="tl-badge '+h.type+'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>'+(lb[h.type]||'推演')+'</div><div class="tl-surface">'+esc(h.surface)+'</div><button class="tl-expand">观妙<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button><div class="tl-depth"><div class="tl-depth-text">'+esc(h.depth)+'</div></div><div class="tl-gua">「'+esc(h.yaoText||'')+'」 — '+gs+' '+gn+' · '+gnat+'</div></div>';w.appendChild(div)}w.scrollTop=0}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uh(){if(ST.history.length>0){document.getElementById('resTitle').textContent='「'+ST.scene+'」';const g=gById(ST.history[0].guaId);document.getElementById('resSub').textContent=g?'起于'+g.n+'卦 · '+g.na:'万象推演';document.getElementById('resScene').textContent='「'+ST.scene+'」'}}


// ═══ Summary ═══
async function gs(){const chain=ST.history.map(function(h){return (gById(h.guaId)?gById(h.guaId).s:'')+' '+(gById(h.guaId)?gById(h.guaId).n:'')}).join(' → ');var sum='',rev='',kws=[];try{var raw=await cai(bsp());var m=raw?raw.match(/\{[\s\S]*\}/):null;if(m){var d=JSON.parse(m[0]);sum=d.summary||'';rev=d.revelation||'';kws=d.keywords||[]}}catch(e){}if(!sum){sum='沙盘归于静默。走完这七卦，最重要的不是答案本身，而是你在这个过程里，比原来更知道自己要什么了。';rev='观即是得，妙在过程';kws=['观照','流转','明白']}const sc=document.getElementById('summaryCard');sc.innerHTML='<div class="summary-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><h3>推 演 总 结</h3></div><div class="summary-body">'+sum+'</div>'+(rev?'<div class="summary-revelation">「'+rev+'」</div>':'')+'<div class="summary-keywords">'+kws.map(k=>'<span>'+k+'</span>').join('')+'</div><div class="summary-chain">卦变之链：'+chain+'</div>'}

// ═══ Controls ═══
async function sg(){var inp=document.getElementById('sceneInput'),sc=inp.value.trim();if(!sc){inp.placeholder='先输入一件事吧…';inp.focus();return}rst(sc);document.getElementById('idlePage').classList.add('hidden');document.getElementById('loadingPage').classList.remove('hidden');document.getElementById('loadScene').textContent='「'+sc+'」';document.getElementById('loadDots').textContent='正在推演...';loadTimer=setInterval(function(){document.getElementById('loadDots').textContent='.'},400);var steps=null,finished=false;var safetyTO=setTimeout(function(){if(finished||ST.step>0)return;finished=true;clearInterval(loadTimer);steps=matchFB(sc);apAll(steps);finishScene()},12000);try{var prompt=AI_PROMPT.replace(/\$SCENE\$/g,sc);var raw=await cai(prompt);if(raw&&raw.length>10){var json=raw.trim();var am=json.match(/\[([\s\S]*)\]/);if(am){try{steps=JSON.parse('['+am[1]+']')}catch(e3){}}}finished=true;clearTimeout(safetyTO)}catch(e){finished=true;clearTimeout(safetyTO)}if(!steps||!Array.isArray(steps)||steps.length<3)steps=matchFB(sc);apAll(steps);finishScene()}
function rst(sc){ST.scene=sc||'';ST.step=0;ST.history=[];ST.nodes=[];ST.threads=[]}
function resetAll(){if(loadTimer)clearInterval(loadTimer);rst('');document.getElementById('idlePage').classList.remove('hidden');document.getElementById('loadingPage').classList.add('hidden');document.getElementById('resultPage').classList.add('hidden');document.getElementById('sceneInput').value='';document.getElementById('timelineWrap').innerHTML='';document.getElementById('summaryCard').innerHTML='';document.getElementById('nodesLayer').innerHTML='';document.querySelectorAll('.sbx-tip').forEach(e=>e.remove());if(ST.anim)cancelAnimationFrame(ST.anim)}

function init(){rsb();rsbx();window.addEventListener('resize',()=>{rsb();rsbx();ln();rnhtml()});document.getElementById('startBtn').addEventListener('click',sg);document.getElementById('sceneInput').addEventListener('keydown',e=>{if(e.key==='Enter')sg()});document.querySelectorAll('.tag').forEach(t=>{t.addEventListener('click',()=>{document.getElementById('sceneInput').value=t.dataset.tag;document.getElementById('sceneInput').focus()})});document.getElementById('sandbox').addEventListener('click',()=>{if(ST.step>0&&ST.step<MAX)exs()});document.getElementById('sandbox').style.cursor='pointer';setInterval(()=>{if(ST.nodes.length)rsbx()},2500)}
document.addEventListener('DOMContentLoaded',init);
// Event delegation for expand buttons
document.addEventListener('click',function(e){var btn=e.target.closest('.tl-expand');if(!btn)return;var d=btn.nextElementSibling;d.classList.toggle('open');btn.innerHTML=d.classList.contains('open')?'收起<svg width=14 height=14 viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><polyline points=\'18 15 12 9 6 15\'/></svg>':'观妙<svg width=14 height=14 viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><polyline points=\'6 9 12 15 18 9\'/></svg>'});
</script>
