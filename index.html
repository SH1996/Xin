<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>暖心伙伴</title>
    <style>
        :root {
            --bg: #fff5f7;
            --card-bg: #ffffff;
            --primary: #d4849a;
            --accent: #e8a0b4;
            --accent-soft: #fce4ec;
            --rose-gold: #c97b8b;
            --lavender: #c9b8d4;
            --lavender-light: #f0e8f4;
            --text: #4a3548;
            --text-light: #8b7b88;
            --text-soft: #b8a8b4;
            --bubble-user: #ffe8ee;
            --bubble-ai: #ffffff;
            --border: #f5e0e8;
            --border-soft: #fde8ef;
            --shadow: 0 2px 16px rgba(212,132,154,0.08);
            --shadow-soft: 0 4px 20px rgba(232,160,180,0.12);
            --shadow-card: 0 2px 12px rgba(200,150,170,0.06);
            --radius: 24px;
            --radius-sm: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --error-bg: #fff5f7;
            --error-border: #f8d0da;
            --step-done: #e8a0b4;
            --gradient-warm: linear-gradient(135deg, #f8c8d4, #e8a0b4);
            --gradient-card: linear-gradient(180deg, #fffafc, #fff5f8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(252,228,236,0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(240,232,244,0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255,245,247,0.6) 0%, transparent 70%);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: rgba(255,245,247,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--gradient-warm);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 3px 12px rgba(232,160,180,0.35);
            position: relative;
        }
        .avatar::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px dashed rgba(232,160,180,0.3);
            animation: spin 20s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .header-title { 
            font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
            background: linear-gradient(135deg, #c97b8b, #d4849a, #e8a0b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-subtitle { font-size: 10px; color: #c97b8b; letter-spacing: 0.4px; font-weight: 600; font-style: italic; }
        .header-actions { display: flex; gap: 6px; align-items: center; }

        .icon-btn {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: var(--card-bg); cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-card); transition: all 0.25s; color: var(--text);
            border: 1px solid var(--border-soft);
        }
        .icon-btn:active { transform: scale(0.92); background: var(--accent-soft); border-color: var(--accent); }

        .mode-toggle {
            display: flex; background: var(--accent-soft); border-radius: 20px; 
            padding: 2px; gap: 2px; border: 1px solid var(--border);
        }
        .mode-btn {
            padding: 5px 12px; border-radius: 18px; border: none;
            font-size: 11px; font-weight: 600; cursor: pointer;
            background: transparent; color: var(--text-soft);
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); 
            white-space: nowrap; letter-spacing: 0.3px;
        }
        .mode-btn.active { background: var(--card-bg); color: var(--rose-gold); box-shadow: 0 2px 8px rgba(212,132,154,0.15); font-weight: 700; }

        /* ========== 步骤进度条（电流特效版） ========== */
        .step-progress {
            display: flex; align-items: center; gap: 0;
            padding: 8px 14px; margin: 8px 12px;
            background: var(--card-bg); border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft); flex-shrink: 0;
            font-size: 11px; min-height: 36px;
            border: 1px solid var(--border-soft);
            position: relative; overflow: hidden;
        }
        .step-progress::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent-soft), var(--lavender-light), var(--accent-soft));
            opacity: 0.6;
        }
        .step-dot {
            width: 20px; height: 20px; border-radius: 50%;
            background: #f8e8ee; display: flex; align-items: center;
            justify-content: center; font-size: 10px; font-weight: 700;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1); 
            flex-shrink: 0; color: #c9b0b8; border: 2px solid transparent;
            position: relative; z-index: 2;
        }
        /* 思考中：点闪烁 */
        .step-dot.thinking { 
            background: #fce4ec; color: var(--rose-gold); 
            border-color: var(--accent); 
            animation: dotGlow 0.8s ease-in-out infinite; 
        }
        @keyframes dotGlow { 
            0%, 100% { box-shadow: 0 0 6px rgba(232,160,180,0.4); transform: scale(1); } 
            50% { box-shadow: 0 0 18px rgba(232,160,180,0.7); transform: scale(1.15); } 
        }
        /* 完成：点停止闪烁 */
        .step-dot.done { 
            background: var(--accent-soft); color: var(--rose-gold); 
            border-color: var(--accent); 
            box-shadow: 0 2px 8px rgba(232,160,180,0.25);
            animation: none;
        }

        /* 连线容器 */
        .step-line {
            flex: 1; height: 3px; min-width: 8px;
            position: relative; z-index: 1;
            background: #f8e8ee; border-radius: 2px;
            overflow: hidden;
        }
        /* 连线完成后的电流光束 */
        .step-line .current-beam {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(232,160,180,0.3) 20%, 
                rgba(255,220,230,0.9) 40%,
                rgba(232,160,180,0.8) 50%,
                rgba(255,220,230,0.9) 60%,
                rgba(232,160,180,0.3) 80%,
                transparent 100%
            );
            animation: currentFlow 0.5s ease-out forwards;
        }
        @keyframes currentFlow {
            0% { transform: translateX(-100%); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateX(0%); opacity: 0.5; }
        }
        /* 连线完成后持续微光 */
        .step-line.done {
            background: linear-gradient(90deg, var(--accent-soft), rgba(232,160,180,0.5), var(--accent-soft));
            transition: background 0.6s ease;
        }

        /* ========== 对话区域 ========== */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 8px 12px 16px;
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
            position: relative;
        }
        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-soft), var(--lavender-light)); border-radius: 10px; }

        .chat-container::after {
            content: '💕 爱你的鹏飞 · 希望金锡永远快乐 💕';
            display: block;
            text-align: center;
            padding: 24px 0 8px;
            font-size: 11px;
            color: #d4a0b4;
            letter-spacing: 0.6px;
            opacity: 0.45;
            font-style: italic;
            flex-shrink: 0;
        }

        .message {
            display: flex; flex-direction: column;
            max-width: 88%; 
            animation: floatIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes floatIn { 
            from { opacity: 0; transform: translateY(18px) scale(0.96); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }

        .bubble {
            padding: 14px 16px; border-radius: 22px;
            font-size: 14px; line-height: 1.6; word-break: break-word;
            transition: all 0.3s; position: relative;
        }
        .message.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(212,132,154,0.08); }
        .message.ai .bubble { background: var(--bubble-ai); border-bottom-left-radius: 8px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-soft); }
        .message.ai .bubble::before { content: '🌸'; position: absolute; top: -8px; left: 12px; font-size: 10px; opacity: 0.4; }

        .model-tag {
            display: inline-block; font-size: 9px; padding: 3px 9px;
            border-radius: 12px; margin-bottom: 5px; font-weight: 700; letter-spacing: 0.4px;
        }
        .model-tag.flash { background: linear-gradient(135deg, #fce4ec, #f8d0e0); color: #c97b8b; }
        .model-tag.pro { background: linear-gradient(135deg, #f0e8f4, #e8d8f0); color: #8b6b9a; }

        .bubble.error-bubble { background: var(--error-bg); border: 1.5px solid var(--error-border); color: #c97b8b; box-shadow: 0 2px 12px rgba(232,160,180,0.1); }

        .retry-btn {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 8px; padding: 12px 20px;
            background: var(--card-bg); border: 2px solid var(--accent);
            border-radius: 24px; color: var(--rose-gold);
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); 
            user-select: none; box-shadow: 0 3px 12px rgba(232,160,180,0.15); letter-spacing: 0.3px;
        }
        .retry-btn:hover { background: var(--accent-soft); border-color: var(--rose-gold); box-shadow: 0 6px 20px rgba(232,160,180,0.25); transform: translateY(-1px); }
        .retry-btn:active { background: #f8d0e0; transform: scale(0.95); }

        .hint-box {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 8px; margin-left: 8px; padding: 8px 14px;
            background: #fffbfc; border: 1.5px solid var(--border);
            border-radius: 16px; font-size: 11px; color: #c97b8b;
            animation: floatIn 0.4s ease; box-shadow: 0 2px 8px rgba(212,132,154,0.06);
        }
        .hint-box::before { content: '💝'; font-size: 14px; }

        /* ========== 思维链面板（可滚动版） ========== */
        .thinking-chain {
            background: var(--gradient-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); margin-top: 8px; overflow: hidden;
            box-shadow: 0 3px 16px rgba(212,132,154,0.06);
            transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            /* 【新增】最大高度限制，超出可滚动 */
            max-height: 350px;
            display: flex;
            flex-direction: column;
        }
        .thinking-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; cursor: pointer;
            font-size: 13px; font-weight: 700; color: var(--rose-gold); 
            user-select: none; transition: all 0.25s; letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        .thinking-header:hover { background: rgba(252,228,236,0.5); }
        .thinking-header .arrow { transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); font-size: 10px; color: var(--accent); }
        .thinking-header.open .arrow { transform: rotate(90deg); }
        .thinking-steps {
            padding: 0 14px; display: flex; flex-direction: column; gap: 8px;
            /* 【修改】不再用max-height隐藏，改用overflow滚动 */
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.22, 0.61, 0.36, 1), padding 0.4s ease;
            /* 【新增】展开后内部可滚动 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .thinking-steps.expanded { 
            max-height: 300px;
            padding: 0 14px 14px; 
            overflow-y: auto;
        }
        /* 滚动条美化 */
        .thinking-steps::-webkit-scrollbar { width: 3px; }
        .thinking-steps::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--accent-soft), var(--lavender-light)); 
            border-radius: 10px; 
        }
        .step-item {
            display: flex; gap: 10px; font-size: 12px; align-items: flex-start;
            padding: 8px 0; border-bottom: 1.5px dotted var(--border);
            animation: floatIn 0.35s ease;
            flex-shrink: 0;
        }
        .step-item:last-child { border-bottom: none; }
        .step-num {
            width: 24px; height: 24px; border-radius: 50%;
            background: #f8e8ee; display: flex; align-items: center;
            justify-content: center; font-size: 11px; font-weight: 700;
            flex-shrink: 0; color: #c9b0b8;
            transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            border: 2px solid transparent;
        }
        .step-num.done { background: var(--accent-soft); color: var(--rose-gold); border-color: var(--accent); box-shadow: 0 2px 8px rgba(232,160,180,0.2); }
        .step-text { flex: 1; line-height: 1.6; color: var(--text); min-width: 0; }
        .step-text strong { color: var(--rose-gold); font-size: 12px; letter-spacing: 0.3px; }

        .loading-inline { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 12px; padding: 6px 0; font-weight: 500; }
        .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.2s infinite; }
        .dot-pulse:nth-child(2) { animation-delay: 0.15s; }
        .dot-pulse:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotPulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.3); } }

        .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: typingBounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-7px); opacity: 1; } }

        .sidebar {
            position: fixed; left: -290px; top: 0;
            width: 270px; height: 100%; height: 100dvh;
            background: var(--card-bg); z-index: 100;
            transition: left 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            box-shadow: 4px 0 30px rgba(200,150,170,0.12);
            display: flex; flex-direction: column; padding: 20px 16px;
            border-right: 2px solid var(--border-soft);
        }
        .sidebar.open { left: 0; }
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(180,130,150,0.25);
            backdrop-filter: blur(2px);
            z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.35s;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        .sidebar-title { 
            font-size: 18px; font-weight: 800; margin-bottom: 18px;
            background: linear-gradient(135deg, #c97b8b, #d4849a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.4px;
        }
        .history-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
        .history-item {
            padding: 12px 14px; border-radius: 14px; cursor: pointer;
            font-size: 13px; transition: all 0.25s; border: 1.5px solid transparent;
            background: #fffafc;
        }
        .history-item:hover { background: var(--accent-soft); border-color: var(--border); box-shadow: 0 3px 12px rgba(232,160,180,0.1); transform: translateX(2px); }
        .history-item:active { background: #f8d0e0; border-color: var(--accent); }
        .history-date { font-size: 10px; color: var(--text-soft); margin-bottom: 4px; letter-spacing: 0.3px; }
        .history-delete { float: right; color: var(--text-soft); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 50%; transition: all 0.2s; }
        .history-delete:hover { background: #ffe8ee; color: #c97b8b; }

        .input-area {
            padding: 10px 12px calc(10px + var(--safe-bottom));
            background: rgba(255,245,247,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1.5px solid var(--border);
            display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
            position: relative;
        }
        .input-area::before {
            content: '';
            position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
        }
        .input-wrapper {
            flex: 1; background: var(--card-bg); border-radius: 26px;
            box-shadow: 0 3px 16px rgba(212,132,154,0.08);
            display: flex; align-items: flex-end;
            padding: 4px 6px 4px 18px; 
            border: 2px solid var(--border-soft);
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 4px 20px rgba(232,160,180,0.18); background: #fffcfd; }
        textarea {
            flex: 1; border: none; outline: none; font-size: 15px;
            padding: 10px 0; resize: none; background: transparent;
            font-family: inherit; max-height: 100px; line-height: 1.5; 
            color: var(--text); letter-spacing: 0.2px;
        }
        textarea::placeholder { color: #d4c0cc; font-style: italic; }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: var(--gradient-warm);
            color: white; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
            box-shadow: 0 4px 16px rgba(232,160,180,0.4);
            position: relative; overflow: hidden;
        }
        .send-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent); border-radius: 50%; }
        .send-btn:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(232,160,180,0.3); }
        .send-btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(20%); }
        .send-btn:not(:disabled):hover { box-shadow: 0 6px 24px rgba(232,160,180,0.5); transform: translateY(-1px); }

        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #4a3548, #5a4558);
            color: #fce4ec; padding: 10px 22px;
            border-radius: 22px; font-size: 13px; z-index: 200;
            opacity: 0; transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1); 
            pointer-events: none; box-shadow: 0 8px 24px rgba(74,53,72,0.25);
            letter-spacing: 0.3px; border: 1px solid rgba(252,228,236,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(180,130,150,0.35);
            backdrop-filter: blur(4px);
            z-index: 150; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.35s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--card-bg); border-radius: 24px;
            padding: 24px 22px; width: 90%; max-width: 380px;
            box-shadow: 0 20px 48px rgba(200,150,170,0.25); 
            max-height: 78vh; overflow-y: auto;
            border: 2px solid var(--border-soft);
        }
        .modal h3 { 
            margin-bottom: 16px; font-size: 18px; font-weight: 800;
            background: linear-gradient(135deg, #c97b8b, #d4849a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.4px;
        }
        .modal label { font-size: 12px; color: var(--text-light); display: block; margin-bottom: 4px; margin-top: 8px; font-weight: 600; letter-spacing: 0.3px; }
        .modal input {
            width: 100%; padding: 10px 14px; border-radius: 14px;
            border: 2px solid var(--border-soft); font-size: 13px;
            margin-bottom: 2px; outline: none; font-family: inherit;
            transition: all 0.3s; background: #fffcfd;
        }
        .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232,160,180,0.1); }
        .modal .hint { font-size: 10px; color: var(--text-soft); margin-bottom: 6px; font-style: italic; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .btn {
            padding: 10px 22px; border-radius: 20px; border: none;
            font-size: 13px; cursor: pointer; font-weight: 700; 
            transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); letter-spacing: 0.3px;
        }
        .btn-primary { background: var(--gradient-warm); color: white; box-shadow: 0 4px 14px rgba(232,160,180,0.35); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(232,160,180,0.45); transform: translateY(-1px); }
        .btn-secondary { background: var(--accent-soft); color: var(--rose-gold); border: 1.5px solid var(--border); }
        .btn-secondary:hover { background: #f8d0e0; }
        .btn:active { transform: scale(0.95); }

        @media (max-width: 380px) {
            .header-title { font-size: 14px; }
            .mode-btn { padding: 4px 10px; font-size: 10px; }
            .bubble { padding: 12px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="modal-overlay" id="apiModal">
        <div class="modal">
            <h3>🎀 配置 DeepSeek V4</h3>
            <label>API URL</label>
            <input type="text" id="apiUrlInput" placeholder="https://api.deepseek.com/v1/chat/completions">
            <label>API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <label>Flash 模型名</label>
            <input type="text" id="modelFlashInput" placeholder="deepseek-v4-flash">
            <div class="hint">用于4步推理 + 快速模式的最终回复</div>
            <label>Pro 模型名</label>
            <input type="text" id="modelProInput" placeholder="deepseek-v4-pro">
            <div class="hint">深度模式的最终回复</div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeApiModal()">取消</button>
                <button class="btn btn-primary" onclick="saveApiConfig()">保存</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">💝 暖心回忆 · 金锡</div>
        <button class="btn btn-secondary" style="width:100%;font-size:12px;margin-bottom:12px;padding:10px;" onclick="clearAllHistory()">🗑 清空所有记录</button>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="header">
        <div class="header-left">
            <div class="avatar">🌸</div>
            <div>
                <div class="header-title">爱你的鹏飞 ❤️</div>
                <div class="header-subtitle" id="modeLabel">希望金锡永远快乐 ✨</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="mode-toggle">
                <button class="mode-btn flash-active active" id="flashModeBtn" onclick="switchMode('flash')">⚡快速</button>
                <button class="mode-btn pro-active" id="deepModeBtn" onclick="switchMode('deep')">🧠深度</button>
            </div>
            <button class="icon-btn" onclick="openApiModal()" title="设置">⚙️</button>
            <button class="icon-btn" onclick="toggleSidebar()" title="回忆">📋</button>
            <button class="icon-btn" onclick="newSession()" title="新对话">✨</button>
        </div>
    </div>

    <!-- 进度条：点+连线 -->
    <div class="step-progress" id="stepProgress">
        <div class="step-dot" id="sd0">1</div><div class="step-line" id="sl0"></div>
        <div class="step-dot" id="sd1">2</div><div class="step-line" id="sl1"></div>
        <div class="step-dot" id="sd2">3</div><div class="step-line" id="sl2"></div>
        <div class="step-dot" id="sd3">4</div><div class="step-line" id="sl3"></div>
        <div class="step-dot" id="sd4">✓</div>
        <span style="font-size:10px;color:var(--text-soft);margin-left:8px;font-weight:500;" id="stepStatus">✨ 准备好了</span>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="在这里写下你的小心情..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="发送">💕</button>
    </div>

    <script>
        // ==================== API 配置 ====================
        const DC = {
            url: 'https://api.deepseek.com/v1/chat/completions',
            apiKey: '',
            flashModel: 'deepseek-v4-flash',
            proModel: 'deepseek-v4-pro'
        };

        function loadConfig() { try { const s = localStorage.getItem('ds_config_v15'); if (s) Object.assign(DC, JSON.parse(s)); } catch (e) {} }
        function saveConfig() { localStorage.setItem('ds_config_v15', JSON.stringify(DC)); }

        function openApiModal() {
            document.getElementById('apiUrlInput').value = DC.url;
            document.getElementById('apiKeyInput').value = DC.apiKey;
            document.getElementById('modelFlashInput').value = DC.flashModel;
            document.getElementById('modelProInput').value = DC.proModel;
            document.getElementById('apiModal').classList.add('active');
        }
        function closeApiModal() { document.getElementById('apiModal').classList.remove('active'); }
        function saveApiConfig() {
            DC.url = document.getElementById('apiUrlInput').value.trim() || DC.url;
            DC.apiKey = document.getElementById('apiKeyInput').value.trim();
            DC.flashModel = document.getElementById('modelFlashInput').value.trim() || DC.flashModel;
            DC.proModel = document.getElementById('modelProInput').value.trim() || DC.proModel;
            saveConfig(); closeApiModal();
            showToast('✅ 已保存');
        }

        // ==================== 模式 ====================
        let currentMode = 'flash';
        function switchMode(m) {
            currentMode = m;
            const flashBtn = document.getElementById('flashModeBtn');
            const deepBtn = document.getElementById('deepModeBtn');
            const modeLabel = document.getElementById('modeLabel');
            if (flashBtn) flashBtn.classList.toggle('active', m === 'flash');
            if (deepBtn) deepBtn.classList.toggle('active', m === 'deep');
            if (modeLabel) modeLabel.textContent = m === 'flash' ? '⚡ 快速模式' : '🧠 深度模式';
        }

        // ==================== 全局状态 ====================
        let conv = [];
        let sessionId = Date.now().toString();
        let busy = false;
        let thinkingSteps = [];
        let activeRequest = null;

        const chatEl = document.getElementById('chatContainer');
        const inputEl = document.getElementById('userInput');
        const sendBtnEl = document.getElementById('sendBtn');
        const toastEl = document.getElementById('toast');
        const histEl = document.getElementById('historyList');
        const stepStatusEl = document.getElementById('stepStatus');

        let tt;
        function showToast(m) {
            clearTimeout(tt);
            toastEl.textContent = m;
            toastEl.classList.add('show');
            tt = setTimeout(() => toastEl.classList.remove('show'), 2200);
        }

        // ==================== 【重写】进度条：点闪烁 + 电流光束 ====================
        /*
          n = -1 : 全部重置
          n = 0  : 第1步进行中 → sd0闪烁
          n = 1  : 第2步进行中 → sd0 done + 电流sl0 + sd1闪烁
          n = 2  : 第3步进行中 → sd0-1 done + 电流sl0-1 + sd2闪烁
          n = 3  : 第4步进行中 → sd0-2 done + 电流sl0-2 + sd3闪烁
          n = 4  : 全部完成 → 全部done + 最后电流
        */
        function syncProgress(n) {
            for (let i = 0; i <= 4; i++) {
                const d = document.getElementById('sd' + i);
                if (!d) continue;
                d.classList.remove('done', 'thinking');
                if (n === -1) continue;
                // 已完成：i < n 或者 n===4 全部完成
                if (i < n || (n === 4)) { d.classList.add('done'); }
                // 进行中：i === n 且 n < 4
                if (i === n && n < 4) { d.classList.add('thinking'); }
            }
            // 处理连线：当前步骤完成时，前面的连线产生电流
            for (let i = 0; i < 4; i++) {
                const l = document.getElementById('sl' + i);
                if (!l) continue;
                // 清除旧光束
                const oldBeam = l.querySelector('.current-beam');
                if (oldBeam) oldBeam.remove();
                l.classList.remove('done');
                if (n === -1) continue;
                // 已完成步骤的连线
                if (i < n) {
                    l.classList.add('done');
                }
            }
            // 【电流特效】对应当前步骤，让前面的连线产生光束
            // n=1: sl0 有电流；n=2: sl0+sl1 有电流；n=3: sl0-2 有电流
            if (n >= 1 && n <= 4) {
                const beamCount = Math.min(n, 4);
                for (let i = 0; i < beamCount; i++) {
                    const l = document.getElementById('sl' + i);
                    if (!l) continue;
                    const oldBeam = l.querySelector('.current-beam');
                    if (oldBeam) oldBeam.remove();
                    const beam = document.createElement('div');
                    beam.className = 'current-beam';
                    l.appendChild(beam);
                }
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
        }

        // ==================== API调用 ====================
        async function callAPI(messages, modelType = 'flash', temp = 0.8, timeout = 25000) {
            if (!DC.apiKey) throw new Error('NO_KEY');
            const model = modelType === 'pro' ? DC.proModel : DC.flashModel;
            if (!navigator.onLine) throw new Error('OFFLINE');
            const ctrl = new AbortController();
            activeRequest = ctrl;
            const tid = setTimeout(() => ctrl.abort(), timeout);
            try {
                const r = await fetch(DC.url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DC.apiKey}` },
                    body: JSON.stringify({ model, messages, temperature: temp, max_tokens: modelType === 'pro' ? 3000 : 800, top_p: 0.9, stream: false }),
                    signal: ctrl.signal
                });
                clearTimeout(tid);
                activeRequest = null;
                if (!r.ok) { const errText = await r.text(); throw new Error(`API ${r.status}: ${errText.slice(0, 100)}`); }
                const d = await r.json();
                return d.choices[0].message.content;
            } catch (e) {
                clearTimeout(tid);
                activeRequest = null;
                if (e.name === 'AbortError') throw new Error('TIMEOUT');
                if (e.message === 'OFFLINE') throw e;
                throw e;
            }
        }

        // ==================== 4步深挖推理 ====================
        async function runThinkingChain(userMsg, msgId) {
            const hist = conv.slice(-10).map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${m.content.slice(0, 150)}`).join('\n');
            const steps = [];
            const labels = ['情绪深潜', '根源追溯', '需求聚焦', '精准回应'];

            syncProgress(0);
            updateThinkingSteps(msgId, steps, true);

            // 第1步
            if (!navigator.onLine) throw new Error('OFFLINE');
            stepStatusEl.textContent = '深潜情绪中...';
            updateStepLoading(msgId, 0, '正在深潜你的情绪世界...');
            const p1 = await callAPI([{ role: 'user', content: `你是一位有深度共情能力的对话分析师。

【对话历史】
${hist || '（这是对话的开始）'}

【用户刚说】
"${userMsg}"

请完成"情绪深潜"分析，要求：
1. 识别用户表面上表达了什么情绪？
2. 在这些表面情绪之下，可能隐藏着什么更微妙的情绪？
3. 用户的用词和语气有没有透露什么矛盾或暗示？
4. 结合对话历史，情绪有没有延续或转变？

请用3-5句话完成分析，不要贴标签，要真正去感受文字背后的情绪层次。` }], 'flash', 0.75, 18000);
            steps.push({ label: labels[0], body: p1 });
            updateThinkingSteps(msgId, [...steps], true);
            markStepDone(msgId, 0);
            syncProgress(1); // 第1步完成→第2步进行中，sl0电流

            // 第2步
            if (!navigator.onLine) throw new Error('OFFLINE');
            stepStatusEl.textContent = '追溯根源...';
            updateStepLoading(msgId, 1, '正在追溯情绪根源...');
            const p2 = await callAPI([{ role: 'user', content: `【第1步情绪深潜结果】
${p1}

【用户原话】
"${userMsg}"

请完成"根源追溯"分析，深入追问：
1. 用户为什么会产生这些情绪？触发点可能是什么？
2. 这个触发点背后，关联到什么样的个人经历、价值观、或未被满足的期待？
3. 用户自己可能意识到了什么？有什么是用户自己可能还没意识到的？
4. 这个情绪模式在对话历史中是否有过类似的影子？

请用3-5句话给出有洞察力的分析，诚实但温柔。` }], 'flash', 0.75, 18000);
            steps.push({ label: labels[1], body: p2 });
            updateThinkingSteps(msgId, [...steps], true);
            markStepDone(msgId, 1);
            syncProgress(2); // 第2步完成→第3步进行中，sl0-sl1电流

            // 第3步
            if (!navigator.onLine) throw new Error('OFFLINE');
            stepStatusEl.textContent = '聚焦需求...';
            updateStepLoading(msgId, 2, '正在聚焦真实需求...');
            const p3 = await callAPI([{ role: 'user', content: `【完整分析】
情绪深潜：${p1}
根源追溯：${p2}

【用户原话】
"${userMsg}"

请完成"需求聚焦"分析：
1. 用户表面在问什么/说什么？
2. 用户真正需要的是什么？
3. 如果只能选择一个最重要的事来回应，你会选择什么？为什么？

请用2-3句话明确说出你的选择和理由。` }], 'flash', 0.75, 18000);
            steps.push({ label: labels[2], body: p3 });
            updateThinkingSteps(msgId, [...steps], true);
            markStepDone(msgId, 2);
            syncProgress(3); // 第3步完成→第4步进行中，sl0-sl2电流

            // 第4步
            if (!navigator.onLine) throw new Error('OFFLINE');
            stepStatusEl.textContent = '制定方案...';
            updateStepLoading(msgId, 3, '正在制定精准回应...');
            const p4 = await callAPI([{ role: 'user', content: `【前三步完整分析】
1. 情绪深潜：${p1}
2. 根源追溯：${p2}
3. 需求聚焦：${p3}

请制定"精准回应方案"：
1. 回应的第一句话应该说什么？
2. 主体部分要围绕什么核心来讲？
3. 用什么语气？
4. 结尾留给用户什么感觉？

请用3-4个简洁要点给出可执行的方案。` }], 'flash', 0.75, 18000);
            steps.push({ label: labels[3], body: p4 });
            updateThinkingSteps(msgId, [...steps], true);
            markStepDone(msgId, 3);
            syncProgress(4); // 全部完成，sl0-sl3电流
            updateThinkingSteps(msgId, steps, false);
            stepStatusEl.textContent = '深度推理完成 ✨';

            return steps;
        }

        function updateThinkingSteps(msgId, steps, expanded) {
            const tc = document.getElementById('ts-' + msgId);
            if (!tc) return;
            if (steps.length === 0) {
                tc.innerHTML = '<div class="loading-inline"><div class="dot-pulse"></div><div class="dot-pulse"></div><div class="dot-pulse"></div><span>准备深度推理...</span></div>';
                return;
            }
            tc.innerHTML = steps.map((s, i) => `
                <div class="step-item" id="step-${msgId}-${i}">
                    <div class="step-num">${i + 1}</div>
                    <div class="step-text"><strong>${esc(s.label)}</strong><br>${esc(s.body)}</div>
                </div>`).join('');
            const header = document.getElementById('thinking-header-' + msgId);
            if (header) {
                header.innerHTML = `<span class="arrow">▶</span> 🧠 深度推理（${steps.length}/4完成）`;
                if (expanded) { header.classList.add('open');
                    tc.classList.add('expanded'); } else { header.classList.remove('open');
                    tc.classList.remove('expanded'); }
            }
            // 【新增】展开后自动滚动到底部
            if (expanded && tc) {
                setTimeout(() => { tc.scrollTop = tc.scrollHeight; }, 100);
            }
        }

        function updateStepLoading(msgId, stepIndex, text) {
            const tc = document.getElementById('ts-' + msgId);
            if (!tc) return;
            let stepEl = document.getElementById('step-' + msgId + '-' + stepIndex);
            if (!stepEl) {
                const div = document.createElement('div');
                div.className = 'step-item';
                div.id = 'step-' + msgId + '-' + stepIndex;
                div.innerHTML = `<div class="step-num">${stepIndex + 1}</div><div class="step-text"><div class="loading-inline"><div class="dot-pulse"></div><div class="dot-pulse"></div><div class="dot-pulse"></div><span>${esc(text)}</span></div></div>`;
                tc.appendChild(div);
                tc.classList.add('expanded');
                const header = document.getElementById('thinking-header-' + msgId);
                if (header) header.classList.add('open');
                // 滚动到最新步骤
                setTimeout(() => { tc.scrollTop = tc.scrollHeight; }, 100);
            }
        }

        function markStepDone(msgId, stepIndex) {
            const stepEl = document.getElementById('step-' + msgId + '-' + stepIndex);
            if (stepEl) { const numEl = stepEl.querySelector('.step-num'); if (numEl) numEl.classList.add('done'); }
        }

        function buildFinalPrompt(userMsg, steps) {
            const hist = conv.slice(-6).map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${m.content.slice(0, 150)}`).join('\n');
            return `【对话历史】
${hist || '（对话开始）'}

【深度推理链】
${steps.map((s, i) => `第${i + 1}步·${s.label}：\n${s.body}`).join('\n\n')}

【用户消息】
"${userMsg}"

请基于以上深度推理链回应。你的回应应该：
- 准确呼应推理中发现的情感和需求
- 自然温暖，像真正理解她的人
- 简洁有力，不空洞
- 给她被真正看见的感觉`;
        }

        // ==================== 发送消息 ====================
        async function sendMessage(userMsgOverride = null) {
            if (busy && !userMsgOverride) return;
            const text = userMsgOverride || inputEl.value.trim();
            if (!text) return;
            if (!DC.apiKey) { showToast('⚠️ 请先配置API Key');
                openApiModal(); return; }
            if (!navigator.onLine) { showToast('⚠️ 当前无网络，请检查连接'); return; }

            busy = true;
            sendBtnEl.disabled = true;
            thinkingSteps = [];

            if (!userMsgOverride) {
                syncProgress(-1);
                stepStatusEl.textContent = '开始...';
                addMsg('user', text, null);
                inputEl.value = '';
                inputEl.style.height = 'auto';
                conv.push({ role: 'user', content: text });
            } else {
                syncProgress(-1);
                stepStatusEl.textContent = '重试中...';
            }

            const msgId = addLoadingMsg();
            const retryData = { msgId, userMsg: text, mode: currentMode };

            try {
                const steps = await runThinkingChain(text, msgId);
                thinkingSteps = steps;
                stepStatusEl.textContent = '推理完成，生成回复中...';

                const el = document.getElementById(msgId);
                if (el) { const bub = el.querySelector('.bubble'); if (bub) bub.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--text-light);margin-top:4px;">正在用心生成回复...</div>'; }

                const fp = buildFinalPrompt(text, steps);
                const sysPrompt = currentMode === 'deep' ?
                    '你是一个有深度洞察力和共情能力的AI伙伴。你的回应让人感觉被真正理解和看见。温暖、真诚、有智慧。' :
                    '你是一个温暖真诚的AI伙伴。你的回应让人感觉被理解。简洁有力，直击内心。';
                const modelType = currentMode === 'deep' ? 'pro' : 'flash';
                stepStatusEl.textContent = currentMode === 'deep' ? 'Pro深度回复中...' : 'Flash回复中...';

                let reply;
                try {
                    reply = await callAPI([{ role: 'system', content: sysPrompt }, ...conv.slice(-8), { role: 'user', content: fp }], modelType, 0.88, currentMode === 'deep' ? 50000 : 25000);
                } catch (e) {
                    if (currentMode === 'deep') {
                        stepStatusEl.textContent = '降级Flash...';
                        reply = await callAPI([{ role: 'system', content: '你是一个温暖真诚的AI伙伴。' }, ...conv.slice(-8), { role: 'user', content: fp }], 'flash', 0.88, 20000);
                    } else { throw e; }
                }

                updateMsgFinal(msgId, reply, steps, modelType === 'pro' || currentMode === 'deep' ? 'pro' : 'flash');
                conv.push({ role: 'assistant', content: reply });
                saveSession(text, reply, steps);
                syncProgress(4);
                stepStatusEl.textContent = '完成 ✓';
                setTimeout(() => { stepStatusEl.textContent = '✨ 准备好了';
                    syncProgress(-1); }, 1500);

            } catch (e) {
                console.error('失败:', e);
                updateMsgError(msgId, getErrorMessage(e), thinkingSteps, retryData);
                stepStatusEl.textContent = '失败，可重试';
                syncProgress(-1);
            }

            busy = false;
            sendBtnEl.disabled = false;
            inputEl.focus();
            scrollBottom();
        }

        function getErrorMessage(e) {
            if (e.message === 'NO_KEY') return '请先配置API Key';
            if (e.message === 'OFFLINE') return '网络断开（切换App会导致断网），请保持页面打开并重试';
            if (e.message === 'TIMEOUT') return '请求超时，可能是网络不稳定或切到后台导致';
            if (e.message.includes('API')) return `服务异常：${e.message}`;
            return `出错了：${e.message}`;
        }

        function retryMessage(msgId, userMsg, mode) {
            if (busy) return;
            if (mode && mode !== currentMode) switchMode(mode);
            const oldEl = document.getElementById(msgId);
            if (oldEl) oldEl.remove();
            showToast('🔄 正在重试...');
            sendMessage(userMsg);
        }

        // ==================== UI消息管理 ====================
        function addMsg(role, content, tag) {
            const d = document.createElement('div');
            d.className = `message ${role}`;
            let h = '';
            if (tag) h += `<div class="model-tag ${tag}">${tag === 'pro' ? 'Pro' : 'Flash'}</div>`;
            h += `<div class="bubble">${fmt(content)}</div>`;
            d.innerHTML = h;
            chatEl.appendChild(d);
            scrollBottom();
        }

        function addLoadingMsg() {
            const id = 'm-' + Date.now();
            const d = document.createElement('div');
            d.className = 'message ai';
            d.id = id;
            d.innerHTML = `
                <div class="bubble">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <div style="font-size:11px;color:var(--text-light);margin-top:4px;">开始深度推理...</div>
                </div>
                <div class="thinking-chain">
                    <div class="thinking-header" id="thinking-header-${id}"><span class="arrow">▶</span> 🧠 深度推理中...</div>
                    <div class="thinking-steps expanded" id="ts-${id}">
                        <div class="loading-inline"><div class="dot-pulse"></div><div class="dot-pulse"></div><div class="dot-pulse"></div><span>准备深度推理...</span></div>
                    </div>
                </div>`;
            chatEl.appendChild(d);
            bindTC(d);
            scrollBottom();
            return id;
        }

        function updateMsgFinal(id, content, steps, tag) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = `
                <div class="model-tag ${tag}">${tag === 'pro' ? 'Pro' : 'Flash'}</div>
                <div class="bubble">${fmt(content)}</div>
                <div class="thinking-chain">
                    <div class="thinking-header" id="thinking-header-${id}"><span class="arrow">▶</span> 🧠 深度推理过程（已完成）</div>
                    <div class="thinking-steps" id="ts-${id}">${steps.map((s, i) => `<div class="step-item"><div class="step-num done">${i + 1}</div><div class="step-text"><strong>${esc(s.label)}</strong><br>${esc(s.body)}</div></div>`).join('')}</div>
                </div>`;
            bindTC(el);
            setTimeout(() => { const hdr = document.getElementById('thinking-header-' + id); const stp = document.getElementById('ts-' + id); if (hdr) hdr.classList.remove('open'); if (stp) stp.classList.remove('expanded'); }, 1000);
            scrollBottom();
        }

        function updateMsgError(id, errorText, steps, retryData) {
            const el = document.getElementById(id);
            if (!el) return;
            let stepsHTML = '';
            if (steps && steps.length > 0) {
                stepsHTML = `<div class="thinking-chain"><div class="thinking-header" id="thinking-header-${id}"><span class="arrow">▶</span> 🧠 推理过程（${steps.length}/4步完成）</div><div class="thinking-steps expanded" id="ts-${id}">${steps.map((s, i) => `<div class="step-item"><div class="step-num done">${i + 1}</div><div class="step-text"><strong>${esc(s.label)}</strong><br>${esc(s.body)}</div></div>`).join('')}</div></div>`;
            }
            el.innerHTML = `
                <div class="bubble error-bubble">
                    <div style="font-weight:600;margin-bottom:6px;">😥 ${esc(errorText)}</div>
                    <div style="font-size:11px;">${steps.length > 0 ? `已完成${steps.length}/4步推理` : '推理未完成'}，可重试</div>
                </div>
                <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                    <button class="retry-btn" onclick="retryMessage('${id}','${esc(retryData.userMsg)}','${retryData.mode}')"><span>🔄</span> 重新生成</button>
                    <div class="hint-box">💝 重试时请保持页面打开，不要切换App哦</div>
                </div>
                ${stepsHTML}`;
            bindTC(el);
            scrollBottom();
        }

        function bindTC(el) {
            const h = el.querySelector('.thinking-header');
            if (h && !h.dataset.ok) { h.dataset.ok = '1';
                h.addEventListener('click', function(e) { e.stopPropagation();
                    this.classList.toggle('open'); const s = el.querySelector('.thinking-steps'); if (s) s.classList.toggle('expanded'); }); }
        }

        function fmt(c) { if (!c) return '';
            let t = esc(c);
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/\n/g, '<br>'); return t; }

        // ==================== 会话存储与加载 ====================
        function saveSession(u, a, steps) {
            try {
                let ss = JSON.parse(localStorage.getItem('cs_v15') || '[]');
                const ix = ss.findIndex(s => s.id === sessionId);
                const sd = {
                    id: sessionId,
                    date: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    preview: u.slice(0, 30),
                    mode: currentMode,
                    steps: steps,
                    messages: JSON.parse(JSON.stringify(conv.slice(-30)))
                };
                if (ix >= 0) ss[ix] = sd;
                else ss.push(sd);
                if (ss.length > 50) ss = ss.slice(-50);
                localStorage.setItem('cs_v15', JSON.stringify(ss));
                updateHist();
            } catch (e) { console.warn('保存失败:', e); }
        }

        function updateHist() {
            try {
                const ss = JSON.parse(localStorage.getItem('cs_v15') || '[]');
                if (!ss.length) {
                    histEl.innerHTML = '<div style="color:var(--text-soft);font-size:12px;text-align:center;padding:20px;">🌸 暂无暖心回忆<br><span style="font-size:10px;">开始一段对话吧</span></div>';
                    return;
                }
                histEl.innerHTML = [...ss].reverse().slice(0, 30).map(s => `
                    <div class="history-item" onclick="loadSess('${s.id}')">
                        <span class="history-delete" onclick="event.stopPropagation();delSess('${s.id}')">×</span>
                        <div class="history-date">${esc(s.date || '未知时间')} · ${s.mode === 'deep' ? '🧠深度' : '⚡快速'}</div>
                        <div>${esc(s.preview || '空对话')}${(s.preview || '').length >= 30 ? '...' : ''}</div>
                    </div>`).join('');
            } catch (e) { histEl.innerHTML = '<div style="color:var(--text-soft);font-size:12px;text-align:center;padding:20px;">历史记录读取失败</div>'; }
        }

        function loadSess(id) {
            try {
                const raw = localStorage.getItem('cs_v15');
                if (!raw) { showToast('没有找到历史记录'); return; }
                const ss = JSON.parse(raw);
                if (!Array.isArray(ss)) { showToast('数据格式错误'); return; }
                const s = ss.find(x => x.id === id);
                if (!s) { showToast('该记录未找到'); return; }
                if (!s.messages || !Array.isArray(s.messages) || s.messages.length === 0) { showToast('对话内容为空'); return; }
                sessionId = s.id;
                conv = s.messages.filter(m => m && m.role && m.content).map(m => ({ role: m.role, content: m.content }));
                if (conv.length === 0) { showToast('无法读取对话'); return; }
                if (s.mode) switchMode(s.mode);
                thinkingSteps = s.steps || [];
                chatEl.innerHTML = '';
                for (const m of conv) addMsg(m.role, m.content, null);
                toggleSidebar();
                showToast(`📂 已加载 ${conv.length} 条对话`);
                scrollBottom();
            } catch (e) { console.error('加载失败:', e);
                showToast('加载失败，请重试'); }
        }

        function delSess(id) {
            try {
                let ss = JSON.parse(localStorage.getItem('cs_v15') || '[]');
                ss = ss.filter(s => s.id !== id);
                localStorage.setItem('cs_v15', JSON.stringify(ss));
                updateHist();
                if (id === sessionId) newSession();
                showToast('已删除');
            } catch (e) { showToast('删除失败'); }
        }

        function clearAllHistory() {
            if (confirm('确定要清空所有暖心回忆吗？此操作不可恢复哦 💝')) {
                localStorage.removeItem('cs_v15');
                updateHist();
                newSession();
                showToast('已清空');
            }
        }

        function newSession() {
            sessionId = Date.now().toString();
            conv = [];
            thinkingSteps = [];
            busy = false;
            activeRequest = null;
            chatEl.innerHTML = '';
            syncProgress(-1);
            stepStatusEl.textContent = '✨ 准备好了';
            addMsg('ai', '嗨，暖心伙伴在这里 🌸\n\n爱你的鹏飞陪着你~\n 希望金锡永远快乐 🎀\n\n💡 我会用心理解你的每一句话\n如果网络中断，点击重试就好 💝', null);
            showToast('✨ 新对话开始啦');
            scrollBottom();
        }

        // ==================== 切后台检测 ====================
        let wasHidden = false;
        let hiddenSince = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') { wasHidden = true;
                hiddenSince = Date.now(); }
            if (document.visibilityState === 'visible' && wasHidden) {
                const dur = Date.now() - hiddenSince;
                wasHidden = false;
                if (dur > 3000) {
                    if (!navigator.onLine) showToast('⚠️ 网络断开');
                    if (busy && activeRequest) { activeRequest.abort();
                        activeRequest = null;
                        showToast('⚠️ 中断了，请点击重试'); }
                }
            }
        });
        window.addEventListener('online', () => showToast('🌐 网络恢复啦'));
        window.addEventListener('offline', () => { showToast('⚠️ 网络断开');
            if (busy && activeRequest) { activeRequest.abort();
                activeRequest = null; } });

        function autoResize(el) { el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
        function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendMessage(); } }
        function esc(t) { if (!t) return ''; const d = document.createElement('div');
            d.textContent = t; return d.innerHTML; }
        function scrollBottom() { requestAnimationFrame(() => { if (chatEl) chatEl.scrollTop = chatEl.scrollHeight; }); }

        function init() {
            loadConfig();
            updateHist();
            syncProgress(-1);
            stepStatusEl.textContent = '✨ 准备好了';
            addMsg('ai', '嗨，暖心伙伴在这里 🌸\n\n爱你的鹏飞陪着你~\n祝谭金锡永远快乐 🎀\n\n💡 我会用心理解你的每一句话\n如果网络中断，点击重试就好 💝', null);
            if (!DC.apiKey) setTimeout(() => showToast('💡 点击齿轮配置API Key'), 1200);
            scrollBottom();
        }
        init();
        console.log('🌸 爱你的鹏飞 · 祝谭金锡永远快乐 · V15 电流特效+可滚动版 🌸');
    </script>
</body>
</html>
