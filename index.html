<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>暖心伙伴</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js">
    </script>
    <style>
        :root {
            --bg: #fff5f7;
            --card-bg: #ffffff;
            --primary: #d4849a;
            --accent: #e8a0b4;
            --accent-soft: #fce4ec;
            --rose-gold: #c97b8b;
            --lavender: #c9b8d4;
            --lavender-light: #f0e8f4;
            --text: #4a3548;
            --text-light: #8b7b88;
            --text-soft: #b8a8b4;
            --bubble-user: #ffe8ee;
            --bubble-ai: #ffffff;
            --border: #f5e0e8;
            --border-soft: #fde8ef;
            --shadow: 0 2px 16px rgba(212, 132, 154, 0.08);
            --shadow-soft: 0 4px 20px rgba(232, 160, 180, 0.12);
            --shadow-card: 0 2px 12px rgba(200, 150, 170, 0.06);
            --radius: 24px;
            --radius-sm: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            --code-bg: #1a1a2e;
            --code-border: #333;
            --code-text: #e0e0e0;
            --blockquote-bg: #fdf8fa;
            --blockquote-border: #e8a0b4;
            --blockquote-text: #8b6b7a;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 20%, rgba(252, 228, 236, 0.5) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(240, 232, 244, 0.4) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(255, 245, 247, 0.6) 0%, transparent 70%);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: rgba(255, 245, 247, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            position: relative;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8c8d4, #e8a0b4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 3px 12px rgba(232, 160, 180, 0.35);
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px dashed rgba(232, 160, 180, 0.3);
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #c97b8b, #d4849a, #e8a0b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 10px;
            color: #c97b8b;
            letter-spacing: 0.4px;
            font-weight: 600;
            font-style: italic;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-card);
            transition: all 0.25s;
            color: var(--text);
            border: 1px solid var(--border-soft);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--accent-soft);
            border-color: var(--accent);
        }

                .step-progress {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 8px 14px;
            margin: 8px 12px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
            font-size: 11px;
            min-height: 36px;
            border: 1px solid var(--border-soft);
            position: relative;
            overflow: hidden;
        }

        .step-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-soft), var(--lavender-light), var(--accent-soft));
            opacity: 0.6;
        }

        .step-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f8e8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            transition: all 0.4s;
            flex-shrink: 0;
            color: #c9b0b8;
            border: 2px solid transparent;
            position: relative;
            z-index: 2;
        }

        .step-dot.thinking {
            background: #fce4ec;
            color: var(--rose-gold);
            border-color: var(--accent);
            animation: dotGlow 0.8s ease-in-out infinite;
        }

        @keyframes dotGlow {
            0%, 100% { box-shadow: 0 0 6px rgba(232, 160, 180, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 18px rgba(232, 160, 180, 0.7); transform: scale(1.15); }
        }

        .step-dot.done {
            background: var(--accent-soft);
            color: var(--rose-gold);
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(232, 160, 180, 0.25);
            animation: none;
        }

        .step-line {
            flex: 1;
            height: 3px;
            min-width: 8px;
            position: relative;
            z-index: 1;
            background: #f8e8ee;
            border-radius: 2px;
            overflow: hidden;
        }

        .step-line .current-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(232, 160, 180, 0.3) 20%, rgba(255, 220, 230, 0.9) 40%, rgba(232, 160, 180, 0.8) 50%, rgba(255, 220, 230, 0.9) 60%, rgba(232, 160, 180, 0.3) 80%, transparent 100%);
            animation: currentFlow 0.5s ease-out forwards;
        }

        @keyframes currentFlow {
            0% { transform: translateX(-100%); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateX(0%); opacity: 0.5; }
        }

        .step-line.done {
            background: linear-gradient(90deg, var(--accent-soft), rgba(232, 160, 180, 0.5), var(--accent-soft));
            transition: background 0.6s ease;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            position: relative;
        }

        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-soft), var(--lavender-light));
            border-radius: 10px;
        }

        .chat-container::after {
            content: '💕 暖心伙伴 · 一直在你身边 💕';
            display: block;
            text-align: center;
            padding: 24px 0 8px;
            font-size: 11px;
            color: #d4a0b4;
            letter-spacing: 0.6px;
            opacity: 0.45;
            font-style: italic;
            flex-shrink: 0;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 92%;
            animation: floatIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }

        .bubble {
            padding: 14px 16px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            transition: all 0.3s;
            position: relative;
        }

        .message.user .bubble {
            background: var(--bubble-user);
            border-bottom-right-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(212, 132, 154, 0.08);
        }

        .message.ai .bubble {
            background: var(--bubble-ai);
            border-bottom-left-radius: 8px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
        }

        .message.ai .bubble::before {
            content: '🌸';
            position: absolute;
            top: -8px;
            left: 12px;
            font-size: 10px;
            opacity: 0.4;
        }

        .model-tag {
            display: inline-block;
            font-size: 9px;
            padding: 3px 9px;
            border-radius: 12px;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .model-tag.flash {
            background: linear-gradient(135deg, #fce4ec, #f8d0e0);
            color: #c97b8b;
        }

        .model-tag.pro {
            background: linear-gradient(135deg, #f0e8f4, #e8d8f0);
            color: #8b6b9a;
        }

        .bubble.error-bubble {
            background: #fff5f7;
            border: 1.5px solid #f8d0da;
            color: #c97b8b;
        }

        .speak-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            margin-top: 6px;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            color: var(--text-soft);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }

        .speak-btn:active {
            background: var(--accent-soft);
            color: var(--rose-gold);
            border-color: var(--accent);
        }

        .speak-btn.speaking {
            background: var(--accent-soft);
            color: var(--rose-gold);
            border-color: var(--accent);
            animation: speakPulse 0.6s ease-in-out infinite;
        }

        @keyframes speakPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(232, 160, 180, 0); }
            50% { box-shadow: 0 0 12px rgba(232, 160, 180, 0.4); }
        }

        .code-block-container {
            background: var(--code-bg);
            border-radius: 10px;
            border: 1px solid var(--code-border);
            margin: 10px 0;
            overflow: hidden;
            font-size: 13px;
        }

        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--code-border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .code-lang-tag { font-size: 11px; color: #aaa; font-family: monospace; }
        .code-copy-btn {
            font-size: 11px;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent);
            padding: 3px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .code-copy-btn:active { transform: scale(0.95); }
        .code-copy-btn.copied {
            background: #4caf50;
            border-color: #4caf50;
            color: #fff;
        }

        .code-char-count {
            font-size: 10px;
            color: #888;
            font-family: monospace;
            margin-left: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .code-scroll-box {
            max-height: 350px;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .code-scroll-box pre {
            margin: 0;
            padding: 14px 16px;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .code-scroll-box pre code {
            font-size: 13px;
            line-height: 1.6;
            display: block;
            min-width: 100%;
            color: #e0e0e0;
        }

        .collapsible-section {
            margin: 12px 0;
            border-top: 1px dashed var(--border);
            padding-top: 8px;
        }

        .collapsible-section:first-of-type { border-top: none; padding-top: 0; }
        .collapsible-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 0;
            user-select: none;
            color: var(--text-soft);
            font-weight: 600;
            font-size: 13px;
        }

        .collapsible-header:hover { color: var(--rose-gold); }
        .collapse-icon {
            font-size: 11px;
            transition: transform 0.25s;
            color: var(--text-soft);
            width: 14px;
            text-align: center;
        }

        .collapsible-header.collapsed .collapse-icon { transform: rotate(-90deg); }
        .collapsible-content { display: none; padding: 6px 0 4px 0; }
        .collapsible-header:not(.collapsed)+.collapsible-content { display: block; }

        .bubble h1, .bubble h2 {
            margin: 16px 0 10px;
            font-weight: 700;
            line-height: 1.3;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .bubble h1 { font-size: 1.35em; color: var(--rose-gold); }
        .bubble h2 { font-size: 1.2em; color: var(--primary); }
        .bubble h3, .bubble h4, .bubble h5, .bubble h6 { margin: 0; font-weight: 600; line-height: 1.3; color: var(--text-soft); }
        .bubble p { margin: 8px 0; }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
        .bubble li { margin: 3px 0; }

        .bubble blockquote {
            background: var(--blockquote-bg);
            border-left: 3px solid var(--blockquote-border);
            padding: 8px 12px;
            margin: 8px 0;
            color: var(--blockquote-text);
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        .bubble code {
            background: rgba(200, 150, 180, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.9em;
            color: var(--rose-gold);
        }

        .bubble pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin: 8px 0;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            color: var(--code-text);
        }

        .bubble pre code { background: none; padding: 0; color: inherit; }
        .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
        .bubble th { background: rgba(232, 160, 180, 0.1); border: 1px solid var(--border); padding: 8px 10px; text-align: left; font-weight: 700; }
        .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
        .bubble a { color: var(--accent); text-decoration: underline; }
        .bubble hr { border: none; border-top: 2px dashed var(--border); margin: 12px 0; }
        .bubble img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .bubble strong { font-weight: 700; color: var(--text); }

        .taiji-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fce4ec, #f0e8f4);
            border: 2px solid var(--border);
            cursor: pointer;
            font-size: 18px;
            margin: 8px 0;
            transition: all 0.35s;
            user-select: none;
            box-shadow: 0 2px 8px rgba(200, 150, 170, 0.1);
        }

        .taiji-toggle:active { transform: scale(0.92); }
        .taiji-toggle.open {
            background: linear-gradient(135deg, #f0d78c, #c9b8d4);
            border-color: #c9b8d4;
            transform: rotate(180deg);
        }

        .yinyang-panels {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .yinyang-panels.expanded { max-height: 600px; }
        .yang-panel {
            background: #fffdf5;
            border: 1.5px solid #f0d78c;
            border-radius: 14px;
            padding: 12px 14px;
            animation: floatIn 0.4s ease;
        }

        .yang-panel .panel-icon { font-size: 18px; margin-bottom: 6px; }
        .yang-panel .panel-text { font-size: 13px; line-height: 1.7; color: #8b6914; }
        .yin-panel {
            background: #f8f5fc;
            border: 1.5px solid #c9b8d4;
            border-radius: 14px;
            padding: 12px 14px;
            animation: floatIn 0.4s ease;
        }

        .yin-panel .panel-icon { font-size: 18px; margin-bottom: 6px; }
        .yin-panel .panel-text { font-size: 13px; line-height: 1.7; color: #5b3e7a; }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 24px;
            color: var(--rose-gold);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            box-shadow: 0 3px 12px rgba(232, 160, 180, 0.15);
            letter-spacing: 0.3px;
        }

        .retry-btn:active { background: #f8d0e0; transform: scale(0.95); }
        .hint-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            margin-left: 8px;
            padding: 8px 14px;
            background: #fffbfc;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            font-size: 11px;
            color: #c97b8b;
            animation: floatIn 0.4s ease;
            box-shadow: 0 2px 8px rgba(212, 132, 154, 0.06);
        }

        .hint-box::before { content: '💝'; font-size: 14px; }

        .thinking-chain {
            background: linear-gradient(180deg, #fffafc, #fff5f8);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 8px;
            overflow: hidden;
            box-shadow: 0 3px 16px rgba(212, 132, 154, 0.06);
            transition: all 0.35s;
            max-height: 350px;
            display: flex;
            flex-direction: column;
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: var(--rose-gold);
            user-select: none;
            transition: all 0.25s;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .thinking-header:hover { background: rgba(252, 228, 236, 0.5); }
        .thinking-header .arrow { transition: transform 0.3s; font-size: 10px; color: var(--accent); }
        .thinking-header.open .arrow { transform: rotate(90deg); }

        .thinking-steps {
            padding: 0 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .thinking-steps.expanded { max-height: 300px; padding: 0 14px 14px; overflow-y: auto; }
        .thinking-steps::-webkit-scrollbar { width: 3px; }
        .thinking-steps::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-soft), var(--lavender-light));
            border-radius: 10px;
        }

        .step-item {
            display: flex;
            gap: 10px;
            font-size: 12px;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1.5px dotted var(--border);
            animation: floatIn 0.35s ease;
            flex-shrink: 0;
        }

        .step-item:last-child { border-bottom: none; }
        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f8e8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
            color: #c9b0b8;
            transition: all 0.4s;
            border: 2px solid transparent;
        }

        .step-num.done {
            background: var(--accent-soft);
            color: var(--rose-gold);
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(232, 160, 180, 0.2);
        }

        .step-text { flex: 1; line-height: 1.6; color: var(--text); min-width: 0; }
        .step-text strong { color: var(--rose-gold); font-size: 12px; letter-spacing: 0.3px; }

        .loading-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            font-size: 12px;
            padding: 6px 0;
            font-weight: 500;
        }

        .dot-pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotPulse 1.2s infinite;
        }

        .dot-pulse:nth-child(2) { animation-delay: 0.15s; }

        // UTF-8 安全的 Base64 编码
        function strToBase64(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            let bin = '';
            const sz = 8192;
            for (let i = 0; i < bytes.length; i += sz) {
                bin += String.fromCharCode(...bytes.subarray(i, Math.min(i + sz, bytes.length)));
            }
            return btoa(bin);
        }
        function base64ToStr(b64) {
            const bin = atob(b64.replace(/\s/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        // ===== GitHub 存储逻辑 (仅在配置了Token时可用) =====
        async function getChatJson() {
            const token = getGithubToken();
            if (!token) return [];
            try {
                const res = await fetch(GITHUB_API, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (res.status === 404) return [];
                if (!res.ok) return [];
                const data = await res.json();
                if (!data.content) return [];
                const decoded = atob(data.content);
                const text = decodeURIComponent(escape(decoded));
                return JSON.parse(text);
            } catch (e) { return []; }
        }

        async function saveChatJson(records) {
            const token = getGithubToken();
            if (!token) return;
            try {
                const jsonStr = JSON.stringify(records, null, 2);
                const utf8Bytes = unescape(encodeURIComponent(jsonStr));
                const content = btoa(utf8Bytes);
                let sha = null;
                try {
                    const check = await fetch(GITHUB_API, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (check.ok) { const info = await check.json(); sha = info.sha; }
                } catch (e) {}
                const body = { message: 'update chat records', content: content, branch: 'main' };
                if (sha) body.sha = sha;
                await fetch(GITHUB_API, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify(body)
                });
            } catch (e) {}
        }

        async function appendChatRecord(record) {
            const token = getGithubToken();
            if (!token) return;
            try {
                const records = await getChatJson();
                records.push(record);
                if (records.length > 200) records.splice(0, records.length - 200);
                await saveChatJson(records);
            } catch (e) {}
        }

            el.dataset.spkTxt = mainText; el.dataset.spkBid = bid; if (steps.length > 0) { bindTC(el);
                setTimeout(() => { const hdr = document.getElementById('thinking-header-' + msgId); const stp = document.getElementById('ts-' + msgId); if (hdr) hdr.classList.remove('open'); if (stp) stp.classList.remove('expanded'); }, 1000); } scrollBottom(); }function safeMarkedParse(text) { const rh = marked.parse(text); return DOMPurify.sanitize(rh, { USE_PROFILES: { html: true }, ADD_TAGS: ['thinking'], ADD_ATTR: ['target'] }); }

        function processCollapsibleHeaders(html) { const hr = /<(h[3-6])([^>]*)>([\s\S]*?)<\/\1>/gi; const ms = []; let m; while ((m = hr.exec(html)) !== null) ms.push({ full: m[0], tag: m[1], attrs: m[2], content: m[3], index: m.index }); if (!ms.length) return html; let ph = html; for (let i = ms.length - 1; i >= 0; i--) { const m = ms[i]; const he = m.index + m.full.length; const ni = (i < ms.length - 1) ? ms[i + 1].index : ph.length; const mc = ph.substring(he, ni); const rp = `<div class="collapsible-section"><div class="collapsible-header collapsed" onclick="window.toggleCollapse(this)"><span class="collapse-icon">▼</span><${m.tag}${m.attrs}>${m.content}</${m.tag}></div><div class="collapsible-content collapsed">${mc}</div></div>`;
                ph = ph.substring(0, m.index) + rp + ph.substring(ni); } return ph; }

        function renderMarkdown(md) { if (!md) return ''; if (rolePlayEnabled) return fmt(md); let html = safeMarkedParse(md);
            html = html.replace(/<pre><code(?:\s+class="language-(\w+)")?>([\s\S]*?)<\/code><\/pre>/g, (match, lang, code) => { const language = lang || 'code'; const decoded = code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'); const cc = decoded.length; const cd = cc > 1000 ? (cc / 1000).toFixed(1) + 'k' : cc; return `<div class="code-block-container"><div class="code-block-header"><span class="code-lang-tag">${language}</span><span style="display:flex;align-items:center;"><span class="code-char-count">${cd} 字符</span><button class="code-copy-btn" onclick="window.copyCode(this)">复制</button></span></div><div class="code-scroll-box"><pre><code class="language-${language}">${code}</code></pre></div></div>`; });
            html = processCollapsibleHeaders(html); return html; }
        window.copyCode = function(btn) { const cb = btn.closest('.code-block-container')?.querySelector('code'); if (!cb) return; const t = cb.textContent;
            navigator.clipboard?.writeText(t).then(() => { btn.textContent = '已复制 ✓'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000); }).catch(() => showToast('复制失败', 'error')); };
        window.toggleCollapse = function(h) { h.classList.toggle('collapsed'); const c = h.nextElementSibling; if (c) c.classList.toggle('collapsed'); };

        function getErrorMessage(e) { if (e.message === 'OFFLINE') return '网络断开'; if (e.message === 'TIMEOUT') return '超时'; if (e.message.includes('API')) return '服务异常：' + e.message; return '出错：' + e.message; }

        function retryMessage(msgId, userMsg, mode) { if (busy) return; const el = document.getElementById(msgId); if (el) el.remove();
            showToast('🔄 重试中...'); sendMessage(userMsg); }

        function addMsg(role, content, tag) { const d = document.createElement('div');
            d.className = 'message ' + role; let h = ''; if (tag) h += '<div class="model-tag ' + tag + '">' + (tag === 'pro' ? 'Pro' : 'Flash') + '</div>';
            const bc = rolePlayEnabled ? fmt(content) : renderMarkdown(content);
            h += '<div class="bubble">' + bc + '</div>'; if (role === 'ai' && content?.length > 10) { const bid = 'spk-' + Date.now();
                h += '<button class="speak-btn" id="' + bid + '" onclick="event.stopPropagation();handleSpeakClick(\'' + bid + '\')"><span>🔊</span> 听回复</button>'; d.dataset.spkTxt = content; d.dataset.spkBid = bid; }
            d.innerHTML = h; chatEl.appendChild(d); scrollBottom(); }

        function handleSpeakClick(bid) { const btn = document.getElementById(bid); const mel = btn?.closest('.message.ai'); const txt = mel?.dataset.spkTxt; if (txt) speakText(txt, btn); }

        function addLoadingMsg() { const id = 'm-' + Date.now(); const d = document.createElement('div');
            d.className = 'message ai'; d.id = id;
            d.innerHTML = '<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div><div style="font-size:11px;color:var(--text-light);margin-top:4px;">正在思考...</div></div>';
            chatEl.appendChild(d); scrollBottom(); return id; }

        function toggleYinYang(panelId, btnId) { const p = document.getElementById(panelId); const b = document.getElementById(btnId); if (!p || !b) return;
            p.classList.toggle('expanded'); b.classList.toggle('open'); setTimeout(scrollBottom, 400); }

        function updateMsgError(id, err, steps, rd) { const el = document.getElementById(id); if (!el) return; const total = 3; let sh = ''; if (steps?.length) { sh = '<div class="thinking-chain"><div class="thinking-header" id="thinking-header-' + id + '"><span class="arrow">▶</span> 🧠 思考（' + steps.length + '/' + total + '步）</div><div class="thinking-steps expanded" id="ts-' + id + '">' + steps.map((s, i) => '<div class="step-item"><div class="step-num done">' + (i + 1) + '</div><div class="step-text"><strong>' + esc(s.label) + '</strong><br>' + esc(s.body) + '</div></div>').join('') + '</div></div>'; }
            el.innerHTML = '<div class="bubble error-bubble"><div style="font-weight:600;margin-bottom:6px;">😥 ' + esc(err) + '</div><div style="font-size:11px;">' + (steps?.length ? steps.length + '/' + total + '步完成' : '未完成') + '，可重试</div></div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;"><button class="retry-btn" onclick="retryMessage(\'' + id + '\',\'' + esc(rd.userMsg) + '\',\'' + rd.mode + '\')"><span>🔄</span> 重新生成</button><div class="hint-box">💝 请保持页面打开</div></div>' + sh;
            bindTC(el); scrollBottom(); }

        function bindTC(el) { const h = el.querySelector('.thinking-header'); if (h && !h.dataset.ok) { h.dataset.ok = '1';
                h.addEventListener('click', function(e) { e.stopPropagation(); this.classList.toggle('open'); const s = el.querySelector('.thinking-steps'); if (s) s.classList.toggle('expanded'); }); } }

        function fmt(c) { if (!c) return '';
            let t = esc(c);
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/---/g, '<hr style="border:none;border-top:1px dashed var(--border);margin:8px 0;">').replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>').replace(/\n/g, '<br>'); return t; }

        function saveSession(u, a, steps, mode) { try { let ss = JSON.parse(localStorage.getItem('cs_v43') || '[]'); const ix = ss.findIndex(s => s.id === sessionId); const sd = { id: sessionId, date: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }), preview: u.slice(0, 30), mode, rp: rolePlayEnabled, steps, messages: JSON.parse(JSON.stringify(conv.slice(-30))) }; if (ix >= 0) ss[ix] = sd; else ss.push(sd); if (ss.length > 50) ss = ss.slice(-50);
                localStorage.setItem('cs_v43', JSON.stringify(ss)); updateHist(); } catch (e) {} }

        function updateHist() { try { const ss = JSON.parse(localStorage.getItem('cs_v43') || '[]'); if (!ss.length) { histEl.innerHTML = '<div style="color:var(--text-soft);font-size:12px;text-align:center;padding:20px;">🌸 暂无回忆</div>'; return; }
                histEl.innerHTML = [...ss].reverse().slice(0, 30).map(s => '<div class="history-item" onclick="loadSess(\'' + s.id + '\')"><span class="history-delete" onclick="event.stopPropagation();delSess(\'' + s.id + '\')">×</span><div class="history-date">' + esc(s.date || '') + ' · ' + (s.mode === 'deep' ? '🧠深' : '⚡快') + (s.rp ? '·💕' : '') + '</div><div>' + esc(s.preview || '') + '</div></div>').join(''); } catch (e) {} }

        function loadSess(id) { try { const raw = localStorage.getItem('cs_v43'); if (!raw) { showToast('无记录'); return; } const ss = JSON.parse(raw); if (!Array.isArray(ss)) { showToast('数据错'); return; } const s = ss.find(x => x.id === id); if (!s?.messages?.length) { showToast('空记录'); return; }
                sessionId = s.id; conv = s.messages.filter(m => m?.role && m?.content).map(m => ({ role: m.role, content: m.content })); if (!conv.length) { showToast('无法读'); return; }
                thinkingSteps = s.steps || []; chatEl.innerHTML = ''; for (const m of conv) addMsg(m.role, m.content, null);
                toggleSidebar(); showToast('📂 已加载'); scrollBottom(); } catch (e) { showToast('加载失败'); } }

        function delSess(id) { try { let ss = JSON.parse(localStorage.getItem('cs_v43') || '[]'); ss = ss.filter(s => s.id !== id);
                localStorage.setItem('cs_v43', JSON.stringify(ss)); updateHist(); if (id === sessionId) newSession(); showToast('已删除'); } catch (e) {} }

        function clearAllHistory() { if (confirm('清空？')) { localStorage.removeItem('cs_v43'); updateHist(); newSession(); showToast('已清空'); } }

        function newSession() { sessionId = Date.now().toString(); conv = []; thinkingSteps = []; busy = false; activeRequest = null; chatEl.innerHTML = '';
            syncProgress(-1, 3); stepStatusEl.textContent = '✨ 准备好了'; addMsg('ai', getWelcomeMessage(), null); showToast('✨ 新对话'); scrollBottom(); }

        let wasHidden = false, hiddenSince = 0;
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { wasHidden = true; hiddenSince = Date.now(); } if (document.visibilityState === 'visible' && wasHidden) { const d = Date.now() - hiddenSince; wasHidden = false; if (d > 3000) { if (!navigator.onLine) showToast('⚠️ 网络断开'); if (busy && activeRequest) { activeRequest.abort(); activeRequest = null; showToast('⚠️ 中断，可重试'); } } } });
        window.addEventListener('online', () => showToast('🌐 网络恢复'));
        window.addEventListener('offline', () => { showToast('⚠️ 网络断开'); if (busy && activeRequest) { activeRequest.abort(); activeRequest = null; } });

        function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }

        let currentSpeech = null;

        function speakText(text, btnEl) { if (currentSpeech) { currentSpeech.cancel(); currentSpeech = null;
                document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking')); if (btnEl?.classList.contains('speaking')) { btnEl.classList.remove('speaking'); return; } } if (!('speechSynthesis' in window)) { showToast('⚠️ 浏览器不支持'); return; } const ct = text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/`/g, '').replace(/#/g, '').replace(/\n/g, '，'); const u = new SpeechSynthesisUtterance(ct);
            u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.1; const vs = speechSynthesis.getVoices(); const zv = vs.find(v => v.lang.startsWith('zh') && (v.name.includes('Ting') || v.name.includes('Lili'))); if (zv) u.voice = zv;
            currentSpeech = u; if (btnEl) btnEl.classList.add('speaking');
            u.onend = () => { currentSpeech = null; if (btnEl) btnEl.classList.remove('speaking'); };
            u.onerror = () => { currentSpeech = null; if (btnEl) btnEl.classList.remove('speaking'); };
            speechSynthesis.speak(u); }

        function init() { updateHist(); syncProgress(-1, 3); stepStatusEl.textContent = '✨ 准备好了'; addMsg('ai', getWelcomeMessage(), null); if ('speechSynthesis' in window) speechSynthesis.getVoices(); scrollBottom(); }
        init();
        console.log('💕 V47 配置外置版 - GitHub与高德Key可选项');
    </script>

    <div class="voice-overlay" id="voiceOverlay" onclick="closeVoicePanel()"></div>
    <div class="voice-panel" id="voicePanel">
        <div class="voice-panel-header">
            <span class="voice-panel-title">📼 语音库 <span id="voiceLibCount" style="font-size:11px;color:#8b5cf6;font-weight:400;">(加载中…)</span></span>
            <button class="voice-panel-close" onclick="closeVoicePanel()">✕</button>
        </div>
        <!-- 录制区 -->
        <div class="voice-record-row">
            <input id="voiceClipLabel" placeholder="关键词，如：调皮" maxlength="20">
            <button class="btn-sm btn-rec" id="voiceRecBtn" onclick="recordVoiceClip()">🎤 录</button>
        </div>
        <div style="text-align:center;margin:4px 0;font-size:10px;color:#555;">填关键词 → 🎤录 → ⏹停 → 自动加入待上传列表</div>
        <!-- 待上传列表 -->
        <div id="voicePendingWrap" style="display:none;margin:8px 0;">
            <div style="font-size:12px;color:#8b5cf6;margin-bottom:4px;">📋 待上传</div>
            <div id="voicePendingList"></div>
            <button class="btn-sm" style="background:#8b5cf6;width:100%;margin-top:6px;font-size:13px;" onclick="saveAllPending()">📤 全部上传</button>
        </div>
        <!-- 已存列表 -->
        <div class="voice-panel-body" id="voiceLibList"><div class="voice-empty">加载中…</div></div>

    </div>
</body>
</html>
